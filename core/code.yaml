
script:
  - id: register_device_with_api
    then:
      - logger.log: "Registering device with slideshow API..."
      - http_request.post:
          url: "${slideshow_api_base}/api/devices"
          request_headers:
            Content-Type: application/json
          json:
            id: "${slideshow_device_id}"
            name: "${friendly_name}"
            width: ${screenwidth}
            height: ${screenheight}
            orientation: "landscape"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200)
                  {
                    ESP_LOGI("slideshow_api", "Device registered successfully");
                  }
                  else
                  {
                    ESP_LOGW("slideshow_api", "Device registration failed with status %d", response->status_code);
                  }

  - id: fetch_slideshow_queue
    then:
      - logger.log: "Fetching slideshow queue from API..."
      - http_request.get:
          url: "${slideshow_api_base}/api/devices/${slideshow_device_id}/slideshow"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200)
                  {
                    ESP_LOGW("slideshow_api", "Failed to fetch queue: status %d", response->status_code);
                    return;
                  }
                  
                  ESP_LOGI("slideshow_api", "Queue response: %s", body.c_str());
                  
                  // Parse JSON and extract image IDs (simplified parser)
                  std::vector<std::string> image_ids;
                  size_t pos = 0;
                  while ((pos = body.find("\"imageId\":\"", pos)) != std::string::npos)
                  {
                    pos += 11; // Length of "imageId":"
                    size_t end = body.find("\"", pos);
                    if (end != std::string::npos)
                    {
                      image_ids.push_back(body.substr(pos, end - pos));
                      pos = end;
                    }
                  }
                  
                  ESP_LOGI("slideshow_api", "Found %d images in queue", image_ids.size());
                  
                  // Store image IDs and construct URLs for first 6 slots
                  text_sensor::TextSensor* url_sensors[6] = {
                    id(ha_image_url_slot_0), id(ha_image_url_slot_1), id(ha_image_url_slot_2),
                    id(ha_image_url_slot_3), id(ha_image_url_slot_4), id(ha_image_url_slot_5)
                  };
                  
                  id(slideshow_queue_ids).clear();
                  for (size_t i = 0; i < image_ids.size(); i++)
                  {
                    id(slideshow_queue_ids).push_back(image_ids[i]);
                  }
                  id(slideshow_queue_index) = 0;
                  
                  // Record fetch time and status
                  if (id(homeassistant_time).now().is_valid())
                  {
                    auto now = id(homeassistant_time).now();
                    char time_str[6];
                    int hour = now.hour % 12;
                    if (hour == 0) hour = 12;
                    snprintf(time_str, sizeof(time_str), "%d:%02d", hour, now.minute);
                    id(slideshow_last_fetch_time) = time_str;
                  }
                  else
                  {
                    id(slideshow_last_fetch_time) = "Pending";
                  }
                  
                  if (image_ids.size() > 0)
                  {
                    id(slideshow_queue_status) = "OK (" + std::to_string(image_ids.size()) + " images)";
                  }
                  else
                  {
                    id(slideshow_queue_status) = "Empty queue";
                  }
                  
                  // // Update LVGL labels only if they're initialized
                  // if (id(debug_queue_status) != nullptr)
                  // {
                  //   lv_label_set_text(id(debug_queue_status), id(slideshow_queue_status).c_str());
                  // }
                  // if (id(debug_last_fetch) != nullptr)
                  // {
                  //   lv_label_set_text(id(debug_last_fetch), ("Fetched: " + id(slideshow_last_fetch_time)).c_str());
                  // }
                  
                  // Initialize component-to-slot mapping for first 4 slots (0-3)
                  id(component_to_slot)[0] = 0;
                  id(component_to_slot)[1] = 1;
                  id(component_to_slot)[2] = 2;
                  id(component_to_slot)[3] = 3;
                  
                  // Populate first 4 URL slots for initial display
                  for (int i = 0; i < 4 && i < image_ids.size(); i++)
                  {
                    std::string url = "${slideshow_api_base}/api/devices/${slideshow_device_id}/images/" + image_ids[i];
                    url_sensors[i]->publish_state(url);
                    ESP_LOGI("slideshow_api", "Slot %d URL: %s", i, url.c_str());
                  }

  - id: advance_slideshow
    then:
      - lambda: |-
          int current = (int)id(image_index).state;
          int old_slot = (current - 1 + 6) % 6;  // Slot we're moving away from
          int new_lookahead = (current + 3) % 6; // New lookahead slot
          
          // Find which component was displaying the old slot and release it
          for (int comp = 0; comp < 4; comp++)
          {
            if (id(component_to_slot)[comp] == old_slot)
            {
              ESP_LOGI("advance", "Releasing component %d (was slot %d)", comp, old_slot);
              
              online_image::OnlineImage* components[4] = {
                id(online_image_0), id(online_image_1),
                id(online_image_2), id(online_image_3)
              };
              components[comp]->release();
              
              // Reassign this component to the new lookahead slot
              id(component_to_slot)[comp] = new_lookahead;
              id(image_slot_success)[old_slot] = false;
              id(image_slot_loading)[old_slot] = false;
              id(image_slot_retry_count)[old_slot] = 0;
              
              ESP_LOGI("advance", "Component %d now assigned to slot %d", comp, new_lookahead);
              break;
            }
          }
          
          // Load URL for new lookahead slot if available in queue
          id(slideshow_queue_index)++;
          int queue_pos = id(slideshow_queue_index) + 2; // Position for 3rd lookahead
          
          if (queue_pos < id(slideshow_queue_ids).size())
          {
            std::string image_id = id(slideshow_queue_ids)[queue_pos];
            std::string url = "${slideshow_api_base}/api/devices/${slideshow_device_id}/images/" + image_id;
            
            text_sensor::TextSensor* url_sensors[6] = {
              id(ha_image_url_slot_0), id(ha_image_url_slot_1), id(ha_image_url_slot_2),
              id(ha_image_url_slot_3), id(ha_image_url_slot_4), id(ha_image_url_slot_5)
            };
            
            url_sensors[new_lookahead]->publish_state(url);
            ESP_LOGI("advance", "Loaded queue position %d into slot %d", queue_pos, new_lookahead);
          }
          else if (id(slideshow_queue_index) >= id(slideshow_queue_ids).size() - 3)
          {
            // Queue running low, fetch new queue
            ESP_LOGI("advance", "Queue exhausted, fetching new queue");
            id(fetch_slideshow_queue).execute();
          }
      - script.execute: find_next_valid_slot

  - id: slideshow_timer
    mode: restart
    then:
      - delay: !lambda "return (int)(id(image_duration_minutes).state * 60 * 1000);"
      - script.execute: advance_slideshow

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - script.execute:
                id: set_phase
                phase: ${voice_assist_idle_phase_id}
          else:
            - script.execute:
                id: set_phase
                phase: ${voice_assist_muted_phase_id}

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          id(playing_internal_sound) = true;
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)->play_file(sound_file, true, false);
          }

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            node: ${name}
            uri: !lambda return tts_uri;
  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            node: ${name}
            text: !lambda return stt_text;
  - id: send_tts_text_event
    parameters:
      tts_text: string
    then:
      - homeassistant.event:
          event: esphome.tts_text
          data:
            node: ${name}
            text: !lambda return tts_text;


  - id: set_phase
    parameters:
      phase: int
    then:
      - lambda: |-
          id(voice_assistant_phase) = phase;
      - binary_sensor.template.publish:
          id: assistant_active
          state: !lambda return phase > 1;
      - text_sensor.template.publish:
          id: voice_assistant_phase_sensor
          state: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d", phase);
            return std::string(buf);
      - homeassistant.event:
          event: esphome.phase_id
          data:
            node: ${name}
            phase: !lambda return phase;

  - id: retry_download_with_backoff
    then:
      - lambda: |-
          int current = (int)id(image_index).state;
          int& retry_count = id(image_slot_retry_count)[current];
          
          // Calculate exponential backoff: 1s, 2s, 4s, 8s, 16s... capped at 300s (5min)
          int delay_seconds = std::min(300, (int)pow(2, retry_count));
          retry_count++;
          
          ESP_LOGI("retry", "Scheduling retry for slot %d in %d seconds (attempt %d)", current, delay_seconds, retry_count);
          id(image_slot_loading)[current] = true;
      - delay: !lambda |-
          int current = (int)id(image_index).state;
          int retry_count = id(image_slot_retry_count)[current] - 1;
          int delay_seconds = std::min(300, (int)pow(2, retry_count));
          return delay_seconds * 1000;
      - script.execute: update_online_images

  - id: update_online_images
    mode: single
    then:
      - lambda: |-
          int current = (int)id(image_index).state;
          
          ESP_LOGI("update_images", "Loading images for current slot %d", current);
          
          online_image::OnlineImage* components[4] = {
            id(online_image_0), id(online_image_1),
            id(online_image_2), id(online_image_3)
          };
          
          text_sensor::TextSensor* url_sensors[6] = {
            id(ha_image_url_slot_0), id(ha_image_url_slot_1), id(ha_image_url_slot_2),
            id(ha_image_url_slot_3), id(ha_image_url_slot_4), id(ha_image_url_slot_5)
          };
          
          // Load current + 3 lookahead slots (4 total)
          for (int offset = 0; offset < 4; offset++)
          {
            int slot = (current + offset) % 6;
            
            // Find which component is assigned to this slot
            int comp = -1;
            for (int c = 0; c < 4; c++)
            {
              if (id(component_to_slot)[c] == slot)
              {
                comp = c;
                break;
              }
            }
            
            if (comp == -1)
            {
              ESP_LOGW("update_images", "No component assigned to slot %d", slot);
              continue;
            }
            
            // Load image if not already loading/loaded
            if (!id(image_slot_loading)[slot] && !id(image_slot_success)[slot])
            {
              std::string url = url_sensors[slot]->state;
              if (!url.empty() && url != "unknown" && url.find("http") == 0)
              {
                ESP_LOGI("update_images", "Component %d loading slot %d: %s", comp, slot, url.c_str());
                components[comp]->set_url(url);
                id(image_slot_loading)[slot] = true;
                components[comp]->update();
              }
            }
          }
      - delay: 500ms
      - lambda: |-
          int current = (int)id(image_index).state;
          
          online_image::OnlineImage* components[4] = {
            id(online_image_0), id(online_image_1),
            id(online_image_2), id(online_image_3)
          };
          
          lv_obj_t* widgets[6] = {
            id(background_image_0), id(background_image_1), id(background_image_2),
            id(background_image_3), id(background_image_4), id(background_image_5)
          };
          
          // Update LVGL widgets for successfully loaded slots
          for (int comp = 0; comp < 4; comp++)
          {
            int slot = id(component_to_slot)[comp];
            
            if (id(image_slot_success)[slot] && widgets[slot] != nullptr)
            {
              auto img_dsc = components[comp]->get_lv_img_dsc();
              if (img_dsc != nullptr)
              {
                ESP_LOGI("update_images", "Updating LVGL slot %d from component %d", slot, comp);
                lv_img_set_src(widgets[slot], img_dsc);
              }
            }
          }
          
          // // Update debug status panel
          // std::string status_str = "";
          // for (int i = 0; i < 6; i++)
          // {
          //   if (id(image_slot_success)[i])
          //   {
          //     status_str += std::to_string(i);
          //   }
          //   else if (id(image_slot_loading)[i])
          //   {
          //     status_str += "(" + std::to_string(i) + ")";
          //   }
          //   if (i < 5) status_str += " ";
          // }
          // lv_label_set_text(id(debug_slots_loaded), ("Loaded: " + status_str).c_str());

  - id: find_next_valid_slot
    then:
      - lambda: |-
          int current = (int)id(image_index).state;
          int attempts = 0;
          int next_slot = (current + 1) % 6;
          
          // Search for next successful slot (max 6 attempts to avoid infinite loop)
          while (attempts < 6)
          {
            if (id(image_slot_success)[next_slot])
            {
              ESP_LOGI("find_next", "Found valid slot %d", next_slot);
              id(image_index).publish_state(next_slot);
              
              // Calculate scroll position and animation
              lv_coord_t target_x = next_slot * ${screenwidth};
              lv_anim_enable_t anim = (next_slot == (current + 1) % 6) ? LV_ANIM_ON : LV_ANIM_OFF;
              
              lv_obj_scroll_to_x(id(image_container), target_x, anim);
              
              // Move viewed container to end
              lv_obj_t* viewed = id(image_map)[current];
              const int map_size = id(image_map).size();
              lv_obj_move_to_index(viewed, map_size - 1);
              lv_obj_scroll_to_x(id(image_container), 0, LV_ANIM_OFF);
              
              return;
            }
            next_slot = (next_slot + 1) % 6;
            attempts++;
          }
          
          ESP_LOGW("find_next", "No valid slots found!");
          // Stay on current slot if no valid images exist

# debug:
#   update_interval: 30s

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"

  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}

  - id: playing_internal_sound
    type: bool
    restore_value: no
    initial_value: "false"

  - id: boot_sound_played
    type: bool
    restore_value: no
    initial_value: "false"

  - id: image_map
    type: 'std::map<int, lv_obj_t*>'
    restore_value: no

  - id: replace_this_image_index
    type: int
    restore_value: no
    initial_value: "-1"
  
  # Image slot state tracking
  - id: image_slot_success
    type: 'std::map<int, bool>'
    restore_value: no
  - id: image_slot_loading
    type: 'std::map<int, bool>'
    restore_value: no
  - id: image_slot_retry_count
    type: 'std::map<int, int>'
    restore_value: no
  
  # Component to slot mapping (which online_image component is assigned to which UI slot)
  - id: component_to_slot
    type: 'std::map<int, int>'
    restore_value: no
  
  # Slideshow queue management
  - id: slideshow_queue_ids
    type: 'std::vector<std::string>'
    restore_value: no
  - id: slideshow_queue_index
    type: int
    restore_value: no
    initial_value: "0"
  - id: slideshow_last_fetch_time
    type: std::string
    restore_value: no
    initial_value: '"--:--"'
  - id: slideshow_queue_status
    type: std::string
    restore_value: no
    initial_value: '"Not loaded"'
    