
online_image:
  - id: online_image_0
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg?text=Slot+0"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    update_interval: never
    placeholder: placeholder_image
    on_download_finished:
      - script.execute:
          id: online_image_download_finished
          index: 0
          is_secondary: false
    on_error:
      - script.execute:
          id: online_image_error
          index: 0
          is_secondary: false

