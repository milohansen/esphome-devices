
online_image:
  - id: online_image_previous
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg?text=previous"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    placeholder: landscape
    on_download_finished:
      - lambda: |-
          int current = (int)id(image_index).state;
          int prev = (current - 1 + 6) % 6;
          ESP_LOGI("online_image", "Previous slot %d downloaded successfully", prev);
          id(image_slot_success)[prev] = true;
          id(image_slot_loading)[prev] = false;
          id(image_slot_retry_count)[prev] = 0;
    on_error:
      - lambda: |-
          int current = (int)id(image_index).state;
          int prev = (current - 1 + 6) % 6;
          ESP_LOGW("online_image", "Previous slot %d download failed (attempt %d)", prev, id(image_slot_retry_count)[prev] + 1);
      - script.execute: retry_download_with_backoff

  - id: online_image_current
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg?text=current"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    placeholder: landscape
    on_download_finished:
      - lambda: |-
          int current = (int)id(image_index).state;
          ESP_LOGI("online_image", "Current slot %d downloaded successfully", current);
          id(image_slot_success)[current] = true;
          id(image_slot_loading)[current] = false;
          id(image_slot_retry_count)[current] = 0;
    on_error:
      - lambda: |-
          int current = (int)id(image_index).state;
          ESP_LOGW("online_image", "Current slot %d download failed (attempt %d)", current, id(image_slot_retry_count)[current] + 1);
      - script.execute: retry_download_with_backoff

  - id: online_image_next
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg?text=next"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    placeholder: landscape
    on_download_finished:
      - lambda: |-
          int current = (int)id(image_index).state;
          int next = (current + 1) % 6;
          ESP_LOGI("online_image", "Next slot %d downloaded successfully", next);
          id(image_slot_success)[next] = true;
          id(image_slot_loading)[next] = false;
          id(image_slot_retry_count)[next] = 0;
    on_error:
      - lambda: |-
          int current = (int)id(image_index).state;
          int next = (current + 1) % 6;
          ESP_LOGW("online_image", "Next slot %d download failed (attempt %d)", next, id(image_slot_retry_count)[next] + 1);
      - script.execute: retry_download_with_backoff

  - id: online_image_lookahead
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg?text=lookahead"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    placeholder: landscape
    on_download_finished:
      - lambda: |-
          int current = (int)id(image_index).state;
          int lookahead = (current + 2) % 6;
          ESP_LOGI("online_image", "Lookahead slot %d downloaded successfully", lookahead);
          id(image_slot_success)[lookahead] = true;
          id(image_slot_loading)[lookahead] = false;
          id(image_slot_retry_count)[lookahead] = 0;
    on_error:
      - lambda: |-
          int current = (int)id(image_index).state;
          int lookahead = (current + 2) % 6;
          ESP_LOGW("online_image", "Lookahead slot %d download failed (attempt %d)", lookahead, id(image_slot_retry_count)[lookahead] + 1);
      - script.execute: retry_download_with_backoff

