
online_image:
  - id: online_image_0
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg?text=Slot+0"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    placeholder: landscape
    on_download_finished:
      - lambda: |-
          int slot = id(component_to_slot)[0];
          ESP_LOGI("online_image", "Component 0 -> Slot %d downloaded successfully", slot);
          id(image_slot_success)[slot] = true;
          id(image_slot_loading)[slot] = false;
          id(image_slot_retry_count)[slot] = 0;
    on_error:
      - lambda: |-
          int slot = id(component_to_slot)[0];
          ESP_LOGW("online_image", "Component 0 -> Slot %d download failed (attempt %d)", slot, id(image_slot_retry_count)[slot] + 1);
          id(image_slot_loading)[slot] = false;
      - script.execute: retry_download_with_backoff

