font:
# Monospace Fonts
  - id: font_big_clock_mono
    file:
      type: gfonts
      family: Source Code Pro
    size: 42
    bpp: 4
  - id: font_small_clock_mono
    file:
      type: gfonts
      family: Source Code Pro
    size: 24
    bpp: 4

# Sans-Serif Fonts
  - id: font_big_date
    file:
      type: gfonts
      family: DM Sans
    size: 22
    bpp: 4

# Serif Fonts
  - id: font_request_response
    file: "./assets/fonts/Fraunces-VF-small.ttf"
    size: 15
    bpp: 4
  - id: font_big_clock
    file: "./assets/fonts/Fraunces-VF-big.ttf"
    size: 60
    bpp: 4
  - id: font_mega_clock
    file: "./assets/fonts/Fraunces-VF-mega.ttf"
    size: 240
    bpp: 4

  - id: font_icons
    # file: "gfonts://Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=wifi,wifi_off,wifi_home,cloud_alert"
    file: "gfonts://Material+Symbols+Outlined"
