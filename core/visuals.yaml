    bpp: 4
    glyphs:
      - "\ue63e"  # wifi
      - "\ue648"  # wifi_off
      - "\uf671"  # wifi_home
      - "\uf3cc"  # cloud_alert
      - "\uf356"  # ear_sound
      - "\ue029"  # mic
      - "\uea1b"  # tea
      - "\ue5cd"  # close
      - "\ue88a"  # home
      - "\ue425"  # timer
      - " "       # (space for empty)

