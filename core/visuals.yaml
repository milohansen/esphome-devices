
online_image:
  - id: placeholder_jpeg
    url: "https://placehold.co/1024x600/4f46e5/FFFFFF/jpeg"
    format: JPEG
    type: RGB565
    byte_order: little_endian
    resize: ${screenwidth}x${screenheight}
    update_interval: never
    placeholder: landscape
    on_download_finished:
      - logger.log: "Download concluded waiting LVGL display."
      - lvgl.image.update:
          id: background_image_1
          src: placeholder_jpeg
      - lvgl.widget.redraw: background_image_1
    on_error:
      - logger.log: "Image download failed. Showing error placeholder."
      - lvgl.image.update:
          id: background_image_1
          src: landscape

