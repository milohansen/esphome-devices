esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: false
  on_boot:
    - priority: 600
      then:
        # read the RTC time once when the system boots
        - rx8130.read_time:
  includes:
    - va_helpers.h
  # platformio_options:
  #   extra_scripts:
  #     - /home/miloh/esphome/extra_script_esphome.py

ota:
  - id: ota_esphome
    platform: esphome
    on_begin: 
      then:
        - lvgl.widget.show: updating_screen
        - logger.log:
            level: INFO
            format: "OTA Start"
        - lvgl.widget.redraw: updating_screen

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: "RZ7D3EzJdPM6"
  on_connect: 
    - script.execute: register_device_with_api
    - delay: 2s
    - script.execute: fetch_slideshow_queue
    - delay: 2s
    - lambda: |-
        id(image_index).publish_state(0);
    - delay: 2s
    - lambda: |-
        // Trigger updates for slots 1 and 2 (next and lookahead) by briefly changing index
        id(image_index).publish_state(1);
    - delay: 1s
    - lambda: |-
        id(image_index).publish_state(0);

captive_portal:

http_request:

time:
  - platform: rx8130
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
    timezone: America/New_York
    address: 0x14
    i2c_id: bus_a
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/New_York
    on_time_sync:
      then:
        # Write time to RTC
        - rx8130.write_time:
        # - script.execute: time_update
    on_time:
      # Update the time label every minute
      - seconds: 0
        then:
         - lvgl.widget.refresh: time_label
      # Update the date label every day at midnight
      - seconds: 0
        minutes: 0
        hours: 0
        then:
         - lvgl.widget.refresh: date_label

api:
  id: ha_api
  homeassistant_services: true
  # on_client_connected:

# Fetch new slideshow queue every 30 minutes
interval:
  - interval: 30min
    then:
      - script.execute: fetch_slideshow_queue
