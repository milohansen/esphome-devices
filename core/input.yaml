select:
  - id: wake_word_engine_location
    platform: template
    entity_category: config
    name: Wake word engine location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - lambda: |-
          ESP_LOGD("select", "wake_word_engine_location changed: %s", x.c_str());
