
button:
  - id: factory_reset_btn
    platform: factory_reset
    internal: true

  - id: add_timer_btn
    platform: template
    name: "Add Timer"
    on_press:
      - logger.log: "Add Timer button pressed"

number:
  - id: image_duration_minutes
    platform: template
    name: "Image Display Time"
    unit_of_measurement: "m"
    icon: "mdi:timer-sand"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 1

  - id: image_index
    platform: template
    name: "Current Image Index"
    icon: "mdi:image-multiple"
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    internal: true
    mode: box
    min_value: 0
    max_value: 5
    step: 1
    initial_value: 0
    on_value:
      - script.execute: apply_image_colors
      - script.execute: update_online_images
      - script.stop: slideshow_timer
      - script.execute: slideshow_timer


switch:
  - id: mute
    platform: template
    name: Mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - script.execute:
          id: set_phase
          phase: ${voice_assist_idle_phase_id}
      # TODO: remove muted icon from display
    on_turn_on:
      - microphone.mute:
      - script.execute:
          id: set_phase
          phase: ${voice_assist_muted_phase_id}
      # TODO: show muted icon on display

  - id: timer_ringing
    platform: template
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
            .set_announcement(true)
            .perform();
          id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          announcement: true
    on_turn_on:
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
            .set_announcement(true)
            .perform();
          id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing

  - id: startup_sound_switch
    platform: template
    name: Startup sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

