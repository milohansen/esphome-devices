script:
  # -------------------------------------------------------------------------
  # API / Data Fetching
  # -------------------------------------------------------------------------
  - id: register_device_with_api
    then:
      - logger.log: "Registering device with slideshow API..."
      - http_request.post:
          url: "${slideshow_api_base}/api/devices"
          request_headers:
            Content-Type: application/json
          json:
            id: "${slideshow_device_id}"
            name: "${friendly_name}"
            width: ${screenwidth}
            height: ${screenheight}
            orientation: "landscape"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    ESP_LOGI("slideshow_api", "Device registered successfully");
                  } else {
                    ESP_LOGW("slideshow_api", "Device registration failed: %d", response->status_code);
                  }

  - id: fetch_slideshow_queue
    mode: single
    parameters:
      count: int
    then:
      - logger.log: "Fetching packed slideshow queue..."
      - http_request.get:
          # Request 'count' items in packed format to save bandwidth/memory
          url: !lambda |-
            return "${slideshow_api_base}/api/devices/${slideshow_device_id}/packed?count=" + std::to_string(count);
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("slideshow_api", "Fetch failed: %d", response->status_code);
                    id(slideshow_queue_status).publish_state("Error " + to_string(response->status_code));
                    return;
                  }

                  // 1. Capture state before appending
                  // We track this so we know if we need to 'start' the slideshow or just 'extend' it.
                  bool was_empty = id(slideshow_queue_ids).empty();
                  size_t previous_size = id(slideshow_queue_ids).size();
                  // id(slideshow_queue_ids).clear();
                  // id(slot_source_colors_map).clear();

                  // Parse Packed JSON: Root is an Array of batches
                  // [[[ "url", "color" ], ...], ...]
                  // Logic: Loop through the JSON and push_back to the existing vector.
                  auto doc = json::parse_json(body);
                  
                  if (!doc.is<JsonArray>()) {
                    ESP_LOGW("slideshow_api", "Invalid packed format (not an array)");
                    return;
                  }

                  JsonArray root = doc.as<JsonArray>();

                  for (JsonArray batch : root) {
                    for (JsonArray img_data : batch) {
                       // item is an array of variants, take the first one
                      //  if (item.size() > 0) {
                      //    JsonArray img_data = item[0].as<JsonArray>();
                         
                         // img_data[0] = URL, img_data[1] = Color
                         if (img_data.size() > 0) {
                           std::string url = img_data[0].as<std::string>();
                           
                           // APPEND to the list
                           id(slideshow_queue_ids).push_back(url);

                           // Map color to the NEW index
                           if (img_data.size() > 1) {
                             int q_idx = id(slideshow_queue_ids).size() - 1;
                             id(slot_source_colors_map)[q_idx] = img_data[1].as<std::string>();
                           }
                         }
                      //  }
                    }
                  }
                  
                  // Log the result
                  size_t added_count = id(slideshow_queue_ids).size() - previous_size;
                  ESP_LOGI("slideshow_api", "Appended %d images. Total: %d", added_count, id(slideshow_queue_ids).size());
                  id(slideshow_queue_status).publish_state("OK (" + to_string(id(slideshow_queue_ids).size()) + " imgs)");

                  // 3. Reset Logic
                  // Only reset the index to 0 if the queue was empty (i.e. first load).
                  // If we are just appending more images, we let the user keep their place.
                  if (was_empty && !id(slideshow_queue_ids).empty()) {
                    id(slideshow_queue_index) = 0;
                    id(image_index).publish_state(0); 
                  }

      - if:
          condition:
            switch.is_off: first_photo_loaded
          then:
            - script.execute: load_first_image
          else:
            - delay: 100ms
            - script.execute: manage_slideshow_memory

 # -------------------------------------------------------------------------
  # Logic & Memory Management
  # -------------------------------------------------------------------------
  - id: load_first_image
    mode: single
    then:
      - switch.turn_on: first_photo_loading
      # Activate the first image if we just loaded it
      - lambda: |-
          if (!id(slideshow_queue_ids).empty()) {
            ESP_LOGI("slideshow_api", "First photo loaded, starting slideshow");
            auto *component = id(online_images)[0];
            std::string target_url = id(slideshow_queue_ids)[0];
            component->set_url(target_url);
            component->update(); 
            id(image_slot_active)[0] = true;
          }
      - script.execute: apply_image_colors
      - wait_until:
          condition:
            switch.is_off: first_photo_loading
          timeout: 30s
      - switch.turn_on: first_photo_loaded
      - logger.log: "First photo loaded, starting slideshow memory management"
      - script.execute: manage_slideshow_memory
      - script.execute: slideshow_timer

  - id: manage_slideshow_memory
    mode: single
    then:
      - lambda: |-
          // Configuration: Load Previous (-1), Current (0), and Next (+1)
          const int WINDOW_SIZE = 3; 
          const int WINDOW_OFFSET = -1;
          int current_q_idx = id(slideshow_queue_index);
          int total_imgs = id(slideshow_queue_ids).size();
          
          if (total_imgs == 0) return;

          // 1. Calculate the active "Window" of Queue Indices
          std::vector<int> active_queue_indices;
          for (int i = 0; i < WINDOW_SIZE; i++) {
            // Calculate raw index with offset (e.g., -1, 0, 1)
            int raw_idx = current_q_idx + WINDOW_OFFSET + i;

            // Handle wrapping for both positive and negative numbers
             // ((n % M) + M) % M is the standard way to handle negative modulo in C++
             int q_idx = ((raw_idx % total_imgs) + total_imgs) % total_imgs;
             
             active_queue_indices.push_back(q_idx);
          }

          // 2. Iterate over all physical slots (0-5)
          for (int slot_idx = 0; slot_idx < 6; slot_idx++) {
            
            // Check if this slot is needed for any of our active queue indices
            // Logic: Slot S is used for Queue Q if (Q % 6 == S)
            int target_queue_idx = -1;
            
            for (int q : active_queue_indices) {
              if ((q % 6) == slot_idx) {
                target_queue_idx = q;
                break;
              }
            }

            auto *component = id(online_images)[slot_idx];

            if (target_queue_idx != -1) {
              // --- SLOT SHOULD BE ACTIVE ---
              std::string target_url = id(slideshow_queue_ids)[target_queue_idx];
              
              // If we have just an ID, construct the full URL
              std::string full_url = target_url; 
              if (full_url.find("http") == std::string::npos) {
                 full_url = "${slideshow_api_base}/api/devices/${slideshow_device_id}/images/" + target_url;
              }

              // Load if not already active
              // We also check if the URL has changed, just in case
              // std::string current_url = component->get_url();
              if (!id(image_slot_active)[slot_idx]) {
                ESP_LOGI("slideshow_mem", "Loading Slot %d (Queue %d)", slot_idx, target_queue_idx);
                component->set_url(full_url);
                component->update(); 
                id(image_slot_active)[slot_idx] = true;
              }
            } else {
              // --- SLOT SHOULD BE INACTIVE ---
              // Release memory if it's currently active
              if (id(image_slot_active)[slot_idx]) {
                ESP_LOGD("slideshow_mem", "Releasing Slot %d", slot_idx);
                component->release();
                id(image_slot_active)[slot_idx] = false;
              }
            }
          }
          
          id(update_debug_status).execute();

  - id: advance_slideshow
    mode: single # Prevent double-clicks from messing up math
    then:
      - lambda: |-
          int total = id(slideshow_queue_ids).size();
          if (total > 0) {
            // 1. Advance the Global Queue Index
            int next_q = (id(slideshow_queue_index) + 1) % total;
            id(slideshow_queue_index) = next_q;
            
            // 2. Calculate which physical Slot (0-5) this corresponds to
            int next_slot = next_q % 6;
            
            ESP_LOGI("slideshow", "Advancing to Queue Index %d (Slot %d)", next_q, next_slot);
            
            // 3. Update the Display
            id(image_index).publish_state(next_slot);
          }
      # 5. Scroll the UI
      - script.execute: handle_lvgl_scroll
      # pause to allow scroll to finish
      - wait_until:
          condition:
            switch.is_off: slideshow_scrolling
          timeout: 2s
      # 6. Apply Image Colors
      - script.execute: apply_image_colors
      - script.execute: slideshow_timer
      - delay: 50ms
      # Update Memory (Load the new lookahead, free the old previous)
      - script.execute: manage_slideshow_memory
      - if:
          condition:
            lambda: |-
              return (id(slideshow_queue_ids).size() - id(slideshow_queue_index))<=3;
          then:
            - script.execute:
                id: fetch_slideshow_queue
                count: 5
            - delay: 1s
            - script.execute: cleanup_slideshow_queue

  - id: handle_lvgl_scroll
    then:
      - lambda: |-
          int slot = (int)id(image_index).state;
          lv_coord_t target_x = slot * ${screenwidth};
          // Use LV_ANIM_ON for smooth scroll
          lv_obj_scroll_to_x(id(image_container), target_x, LV_ANIM_ON);

  - id: apply_image_colors
    then:
      - lambda: |-
          int q_idx = id(slideshow_queue_index);
          
          if (id(slot_source_colors_map).contains(q_idx)) {
            std::string color_str = id(slot_source_colors_map)[q_idx];
            ESP_LOGD("slideshow_colors", "Setting color for Queue Index %d (%s)", q_idx, color_str.c_str());
            
            // Clean hex string
            if (!color_str.empty() && color_str[0] == '#') color_str = color_str.substr(1);
            if (color_str.length() == 6) color_str = "FF" + color_str;
            
            if (color_str.length() == 8) {
              uint32_t color = std::stoul(color_str, nullptr, 16);
              id(material_theme_component).set_source_color(color);
              auto scheme = id(material_theme_component).generate_scheme();

              // id(primary_base) = esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.primary);
              esphome::Color primary_color = esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.primary);
              id(primary_base) = primary_color;

              lv_style_set_bg_color(id(primary_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.primary));
              lv_style_set_text_color(id(primary_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_primary));
              lv_style_set_bg_color(id(primary_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.primary_container));
              lv_style_set_text_color(id(primary_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_primary_container));
              
              lv_style_set_bg_color(id(secondary_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.secondary));
              lv_style_set_text_color(id(secondary_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_secondary));
              lv_style_set_bg_color(id(secondary_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.secondary_container));
              lv_style_set_text_color(id(secondary_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_secondary_container));
              
              lv_style_set_bg_color(id(tertiary_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.tertiary));
              lv_style_set_text_color(id(tertiary_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_tertiary));
              lv_style_set_bg_color(id(tertiary_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.tertiary_container));
              lv_style_set_text_color(id(tertiary_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_tertiary_container));
              
              lv_style_set_bg_color(id(error_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.error));
              lv_style_set_text_color(id(error_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_error));
              lv_style_set_bg_color(id(error_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.error_container));
              lv_style_set_text_color(id(error_container_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_error_container));

              lv_style_set_bg_color(id(background_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.background));
              lv_style_set_text_color(id(background_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_background));
              lv_style_set_bg_color(id(surface_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.surface));
              lv_style_set_text_color(id(surface_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_surface));
              lv_style_set_bg_color(id(surface_var_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.surface_variant));
              lv_style_set_text_color(id(surface_var_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.on_surface_variant));

              lv_style_set_arc_color(id(primary_arc_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.primary));
              lv_style_set_arc_color(id(secondary_arc_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.secondary));
              lv_style_set_arc_color(id(surface_arc_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.surface));

              lv_style_set_text_color(id(text_shadow_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.shadow));
              lv_style_set_shadow_color(id(shadow_style), esphome::material_theme::MaterialThemeComponent::argb_to_color(scheme.shadow));
              
              
              ESP_LOGD("slideshow_colors", "Applied primary color: #%s", esphome::material_theme::MaterialThemeComponent::argb_to_hex(scheme.primary).c_str());
            }
          } else {
            ESP_LOGD("slideshow_colors", "No color mapping for Queue Index %d", q_idx);
          }

  - id: slideshow_timer
    mode: restart
    then:
      - delay: !lambda "return (int)(id(image_duration_minutes).state * 60 * 1000);"
      - script.execute: advance_slideshow
      # - script.execute: slideshow_timer

  - id: update_debug_status
    then:
      - lambda: |-
          std::string s = "";
          for(int i=0; i<6; i++) {
            s += "[" + to_string(i) + ":";
            if(id(image_slot_active)[i]) s += "ON";
            else s += "--";
            s += "] ";
          }
          id(slideshow_debug_status).publish_state(s);

  - id: cleanup_slideshow_queue
    mode: single
    then:
      - lambda: |-
          // Configuration
          const int KEEP_HISTORY = 12; // Keep at least 12 images *before* current index
          const int MIN_QUEUE_SIZE = 24; // Don't bother cleaning if queue is small
          
          int current_idx = id(slideshow_queue_index);
          auto& vec = id(slideshow_queue_ids);
          
          // Safety check
          if (vec.size() < MIN_QUEUE_SIZE || current_idx < KEEP_HISTORY + 6) {
            return;
          }

          // Calculate how many to prune
          // MUST be a multiple of 6 to preserve (Index % 6) alignment for UI slots
          int raw_prune_target = current_idx - KEEP_HISTORY;
          int prune_count = (raw_prune_target / 6) * 6;

          if (prune_count <= 0) return;

          ESP_LOGI("slideshow_clean", "Cleaning up memory. Pruning %d old images...", prune_count);

          // 1. Remove from Vector (Queue IDs)
          if (prune_count < vec.size()) {
            vec.erase(vec.begin(), vec.begin() + prune_count);
          }

          // 2. Shift Global Index
          id(slideshow_queue_index) -= prune_count;

          // 3. Shift Color Map Keys
          std::map<int, std::string> new_map;
          for (auto const& [key, val] : id(slot_source_colors_map)) {
            if (key >= prune_count) {
              new_map[key - prune_count] = val;
            }
          }
          id(slot_source_colors_map) = new_map;

          ESP_LOGI("slideshow_clean", "Cleanup complete. Queue size: %d, New Index: %d", 
                   vec.size(), id(slideshow_queue_index));

  # -------------------------------------------------------------------------
  # Callbacks
  # -------------------------------------------------------------------------
  - id: online_image_download_finished
    parameters:
      index: int
    then:
      - lambda: |-
          int slot = index;
          // Only update LVGL if this slot is supposed to be active
          if (id(image_slot_active)[slot]) {
            // Update LVGL image source
            auto *comp = id(online_images)[slot];
            auto *widget = id(image_widgets)[slot];
            if (widget) {
               lv_img_set_src(widget, comp->get_lv_img_dsc());
            }
          }
      - if:
          condition:
            switch.is_on: first_photo_loading
          then:
            - switch.turn_off: first_photo_loading
  
  - id: online_image_error
    parameters:
      index: int
    then:
      - logger.log: 
          format: "Download failed for slot %d"
          args: [index]
          level: WARN
      # Optional: Implement backoff retry here if needed

  - id: set_debug_visibility
    then:
      - lambda: |-
          bool show = id(show_slideshow_debug).state;
          for (auto obj : id(debug_widgets)) {
            if (show) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          }

globals:
  # Main Queue
  - id: slideshow_queue_ids
    type: "std::vector<std::string>"
    restore_value: no
    
  - id: slot_source_colors_map
    type: "std::map<int, std::string>"
    restore_value: no

  # State Tracking
  - id: slideshow_queue_index
    type: int
    restore_value: no
    initial_value: "0"

  - id: image_slot_active
    type: "std::map<int, bool>"
    restore_value: no

  - id: debug_widgets
    type: "std::vector<lv_obj_t*>"
    restore_value: no

text_sensor:
  - id: slideshow_queue_status
    platform: template
    name: "Slideshow Queue Status"
    icon: mdi:playlist-check
    
  - id: slideshow_debug_status
    platform: template
    name: "Slideshow Slot Status"
    icon: mdi:developer-board

mapping:
  # Map index to Component
  - id: online_images
    from: int
    to: online_image::OnlineImage
    entries:
      0: online_image_0
      1: online_image_1
      2: online_image_2
      3: online_image_3
      4: online_image_4
      5: online_image_5

  # Map index to LVGL Widget
  - id: image_widgets
    from: int
    to: lv_obj_t
    entries:
      0: background_image_0
      1: background_image_1
      2: background_image_2
      3: background_image_3
      4: background_image_4
      5: background_image_5


switch:
  - id: first_photo_loaded
    platform: template
    name: "First Photo Loaded"
    optimistic: true
    restore_mode: ALWAYS_OFF
    internal: true
  - id: first_photo_loading
    platform: template
    name: "First Photo Loading"
    optimistic: true
    restore_mode: ALWAYS_ON
    internal: true

  - id: slideshow_scrolling
    platform: template
    name: "Slideshow Scrolling"
    optimistic: true
    restore_mode: ALWAYS_OFF
    internal: true

  - id: show_slideshow_debug
    platform: template
    name: "Show Slideshow Debug"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # internal: true
    on_state: 
      - script.execute: set_debug_visibility