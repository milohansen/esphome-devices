# Home Assistant Configuration for Material Theme Integration
# Add these snippets to your Home Assistant configuration.yaml

# Enable Python Scripts
python_script:

# Input text to store extracted color
input_text:
  theme_color:
    name: "Theme Primary Color"
    initial: "FF6366F1"  # Default indigo color
    icon: mdi:palette

  wallpaper_path:
    name: "Wallpaper Image Path"
    initial: "wallpapers/default.jpg"
    icon: mdi:image

# Optional: Input select for theme variants
input_select:
  theme_variant:
    name: "Theme Variant"
    options:
      - "TONAL_SPOT"
      - "VIBRANT"
      - "EXPRESSIVE"
      - "CONTENT"
      - "MONOCHROME"
      - "NEUTRAL"
    initial: "TONAL_SPOT"
    icon: mdi:palette-swatch

  theme_mode:
    name: "Theme Mode"
    options:
      - "Light"
      - "Dark"
    initial: "Light"
    icon: mdi:theme-light-dark

# Optional: Number input for contrast level
input_number:
  theme_contrast:
    name: "Theme Contrast Level"
    min: -1.0
    max: 1.0
    step: 0.1
    initial: 0.0
    icon: mdi:contrast-circle

# Sensor to format the complete theme config
sensor:
  - platform: template
    sensors:
      esphome_theme_config:
        friendly_name: "ESPHome Theme Config"
        value_template: >
          {{ states('input_text.theme_color') }}
        attribute_templates:
          variant: "{{ states('input_select.theme_variant') }}"
          is_dark: "{{ states('input_select.theme_mode') == 'Dark' }}"
          contrast: "{{ states('input_number.theme_contrast') | float }}"
