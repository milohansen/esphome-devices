# --- WIDGET TEMPLATING -------------------------------------------------------
  
# ESPHome hidden items for widget templates
# IMAGES
.image_container_template: &image_container_template
  height: ${screenheight}
  width: ${screenwidth}
  snappable: true
  clip_corner: true
  bg_color: black
  bg_opa: COVER
  layout:
    type: flex
    flex_flow: row
    flex_align_main: center
    flex_align_cross: center
    pad_column: 4

.image_template: &image_template
  height: ${screenheight}

.image_label_template: &image_label_template
  text_font: "montserrat_42"
  text_color: white
  floating: true

# TIMERS
.timer_container_template: &timer_container_template
  # height: SIZE_CONTENT
  width: 300px
  height: 350px
  bg_color: white
  bg_opa: COVER
  radius: 4px
  border_width: 1
  # layout: vertical

.timer_arc_template: &timer_arc_template
  width: 300
  height: 300
  value: 32767
  min_value: 0
  max_value: 32767
  arc_width: 5
  adjustable: false
  start_angle: 0
  end_angle: 360
  rotation: 270
  align: CENTER
  adv_hittest: true
  # arc_color: 0x4F46E5
  # arc_opa: 50%
  # arc_opa: 0%

.timer_label_template: &timer_label_template
  text: "0:00"
  text_color: 0x4F46E5
  text_align: CENTER
  long_mode: SCROLL
  text_font: montserrat_20
  floating: true
  align: CENTER

.timer_button_template: &timer_button_template
  text: "Cancel"
  text_font: montserrat_14
  # y: 40
  height: 30
  width: 80
  floating: true
  align: BOTTOM_MID
  bg_color: 0xE0E7FF
  text_color: 0x4338CA
  radius: 4px
  border_width: 0


# --- LVGL CONFIGURATION --------------------------------------------------------
lvgl:
  id: lvgl_component
  displays: main_display
  touchscreens: my_touchscreen
  buffer_size: 100%
  byte_order: little_endian

  disp_bg_color: black
  disp_bg_opa: COVER

  # log_level: info

  style_definitions:
    - id: image_style
      radius: 0
  gradients:
    - id: gradient_background
      stops:
        - position: 0
          color: 0xc2e59c
        - position: 255
          color: 0x64b3f4

  # Warm earthy palette inspired by palette-2.css
  # Colors: Terracotta primary, Stone neutrals, Olive/Mustard/Brick accents
  theme:
    # Base object styling
    obj:
      bg_color: background_surface
      text_color: text_main
      border_color: border_color
      shadow_color: text_main
      
    # Button styling
    button:
      bg_color: primary_base
      text_color: text_inverse
      radius: 8
      border_width: 0
      shadow_width: 4
      shadow_opa: 20%
      pressed:
        bg_color: primary_active
      checked:
        bg_color: secondary_base
        text_color: text_inverse
      disabled:
        bg_color: border_color
        text_color: text_muted
    
    # Button matrix styling
    buttonmatrix:
      bg_color: background_surface
      border_color: border_color
      items:
        bg_color: primary_base
        text_color: text_inverse
        pressed:
          bg_color: primary_active
        checked:
          bg_color: secondary_base
          text_color: text_inverse
    
    # Checkbox styling
    checkbox:
      bg_color: background_page
      border_color: primary_base
      radius: 4
      checked:
        bg_color: primary_base
        border_color: primary_base
    
    # Switch styling  
    switch:
      bg_color: border_color
      border_color: primary_base
      indicator:
        bg_color: primary_base
    
    # Slider styling
    slider:
      bg_color: border_color
      main:
        bg_color: primary_base
      indicator:
        bg_color: secondary_base
      knob:
        bg_color: background_page
        border_color: primary_base
        border_width: 2
        radius: 1000
    
    # Arc styling
    arc:
      arc_color: border_color
      arc_width: 8
      indicator:
        arc_color: primary_base
        arc_width: 8
      knob:
        bg_color: background_page
        border_color: primary_base
        border_width: 2
    
    # Dropdown styling
    dropdown:
      bg_color: background_page
      text_color: text_main
      border_color: border_color
      indicator:
        text_color: text_main
    
    # Roller styling
    roller:
      bg_color: background_page
      text_color: text_main
      selected:
        bg_color: primary_base
        text_color: text_inverse
    
    # Spinner styling
    spinner:
      arc_color: primary_base
      indicator:
        arc_color: secondary_base
    
    # Textarea styling
    textarea:
      bg_color: background_page
      text_color: text_main
      border_color: border_color
      cursor:
        bg_color: text_main
      selected:
        bg_color: primary_hover
        text_color: text_main
    
    # Label styling
    label:
      text_color: text_main
    
    # Line styling
    line:
      line_color: primary_base
      line_width: 2
    
    # Bar styling
    bar:
      bg_color: border_color
      indicator:
        bg_color: primary_base
    
    # Meter styling
    meter:
      bg_color: background_surface
      border_color: border_color
      indicator:
        line_color: secondary_base
        arc_color: primary_base


  top_layer:
    widgets:
      - label:
          <<: *image_label_template
          id: debug_label
          text: "0"
          align: TOP_MID
      - obj:
          id: assistant_container
          y: -42px
          align: TOP_MID
          min_width: 256px
          # width: 100%
          height: 42px
          bg_color: background_surface
          bg_opa: COVER
          radius: 6px
          pad_all: 3px
          pad_top: 9px
          
          shadow_spread: 4
          
          layout:
            type: flex
            flex_flow: row
            flex_align_main: space_between
            flex_align_cross: end
            pad_column: 12px
          widgets:
            - label:
                id: assistant_request_label
                text: "-"
                text_font: montserrat_28
                align: LEFT_MID
            - label:
                id: assistant_response_label
                text: "-"
                text_font: montserrat_28
                align: RIGHT_MID
            # - label:
            #     id: assistant_state_label
            #     text: "Idle"
            #     text_font: montserrat_28
            #     text_align: center
            #     align: BOTTOM_MID
      - obj:
          id: updating_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: black
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          hidden: true
          widgets:
            - label:
                id: updating_label
                text: "Updating..."
                text_font: font_big_clock
                text_align: left
                text_color: white
                x: 128
                y: 128

  # --- LVGL PAGES ----------------------------------------------------------------            
  pages:
    - id: home_page
      bg_color: background_page
      bg_opa: COVER
      # bg_grad: gradient_background
      scrollable: false
      widgets:
        - obj:
            id: home_assistant_container
            align: TOP_MID
            width: 100%
            height: SIZE_CONTENT
            pad_all: 12px
            radius: 0
            border_width: 0
            
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: end

            widgets:
              - label:
                  id: home_assistant_request_label
                  text: "-"
                  text_font: montserrat_28
                  align: LEFT_MID
                  long_mode: WRAP
                  flex_grow: 1
              - label:
                  id: home_assistant_response_label
                  text: "-"
                  text_font: montserrat_28
                  text_align: right
                  align: RIGHT_MID
                  long_mode: WRAP
                  flex_grow: 1

        - container:
            id: image_container
            align: TOP_LEFT
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            pad_all: 0
            border_width: 0
            scrollable: true
            scroll_dir: hor
            scroll_snap_x: "START"
            scrollbar_mode: "OFF"
            scroll_one: true
            scroll_elastic: true
            
            shadow_spread: 4

            layout:
              type: flex
              flex_flow: row
              flex_align_main: start
              flex_align_track: start
              flex_align_cross: stretch

            on_boot:
              - lambda: |-
                  lv_obj_scroll_to_x(id(image_container), 0, LV_ANIM_OFF);

                  // id(image_map)[0] = id(image_subcontainer_0);
                  // id(image_map)[1] = id(image_subcontainer_1);
                  // id(image_map)[2] = id(image_subcontainer_2);
                  // id(image_map)[3] = id(image_subcontainer_3);
                  // id(image_map)[4] = id(image_subcontainer_4);
                  // id(image_map)[5] = id(image_subcontainer_5);

            on_scroll_end:
              - lambda: |-
                  int16_t x_pos = lv_obj_get_scroll_x(id(image_container));
                  ESP_LOGD("lvgl", "Scroll ended at x=%d", x_pos);

            widgets:
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_0
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_0
                        src: placeholder_image
                    # - image:
                    #     <<: *image_template
                    #     id: test_pairing
                    #     src: placeholder_image
                    - label:
                        <<: *image_label_template
                        text: "0"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_1
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_1
                        src: placeholder_image
                    - label:
                        <<: *image_label_template
                        text: "1"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_2
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_2
                        src: placeholder_image
                    - label:
                        <<: *image_label_template
                        text: "2"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_3
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_3
                        src: placeholder_image
                    - label:
                        <<: *image_label_template
                        text: "3"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_4
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_4
                        src: placeholder_image
                    - label:
                        <<: *image_label_template
                        text: "4"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_5
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_5
                        src: placeholder_image
                    - label:
                        <<: *image_label_template
                        text: "5"

              - button:
                  id: button_talk
                  text: "Talk"
                  floating: true
                  align: TOP_LEFT
                  x: 60
                  y: 60
                  on_click:
                    - if:
                        condition: voice_assistant.is_running
                        then:
                          - voice_assistant.stop:
                        else:
                          - voice_assistant.start_continuous:

              - button:
                  id: button_next
                  text: "Next"
                  floating: true
                  align: TOP_RIGHT
                  x: -60
                  y: 60
                  on_click:
                    then:
                      - script.execute: advance_slideshow
                      # - number.increment: image_index
                      # - script.execute: find_next_valid_slot
              
              - button:
                  id: button_show_timers
                  # text: "Show Timers"
                  floating: true
                  align: BOTTOM_RIGHT
                  y: -56
                  x: -56
                  width: 72
                  height: 56
                  radius: 29
                  on_click:
                    then:
                      - lvgl.page.show: timer_page
                  widgets:
                    - label:
                        align: CENTER
                        text_font: font_icons
                        text_color: text_inverse
                        text: "\ue425"
              
              - container:
                  id: time_date_container
                  scrollable: false
                  height: SIZE_CONTENT
                  width: SIZE_CONTENT
                  # width: 1024px
                  floating: true
                  align: BOTTOM_LEFT
                  x: 60
                  y: -60
                  layout:
                    type: flex
                    flex_flow: column_reverse
                    flex_align_main: start
                    flex_align_cross: start
                    flex_align_track: start
                  widgets:
                    - label:
                        id: time_label
                        text:
                          format: "%d:%02d"
                          args: ['id(homeassistant_time).now().hour % 12 == 0 ? 12 : id(homeassistant_time).now().hour % 12', id(homeassistant_time).now().minute]
                        text_font: font_big_clock
                        text_align: left
                        text_color: white
                        on_boot:
                          lvgl.widget.refresh: time_label
                    - label:
                        id: date_label
                        text:
                          time_format: "%a, %b %d"
                          time: !lambda return id(homeassistant_time).now();
                        text_font: font_big_date
                        text_align: left
                        text_color: white
                        on_boot:
                          lvgl.widget.refresh: date_label
          
        - button:
            id: button_test
            text: "TEST"
            floating: true
            align: BOTTOM_MID
            y: -60
            on_click:
              then:
                - script.execute: cleanup_slideshow_queue
                # - script.execute: 
                #     id: fetch_slideshow_queue
                #     count: 4
                # - lambda: |-
                #     static bool toggle = false;
                #     toggle = !toggle;
                #     int h = lv_obj_get_height(id(home_assistant_container));
                #     int32_t start = 0;
                #     int32_t end = h;
                #     if (!toggle) {
                #       int y_pos = lv_obj_get_y(id(image_container));
                #       ESP_LOGD("custom", "home_assistant_container height=%d, image_container y=%d", h, y_pos);
                #       start = y_pos;
                #       end = 0;
                #     }

                #     // int h = lv_obj_get_height(id(home_assistant_container));
                #     // ESP_LOGD("custom", "TEST button clicked, home_assistant_container height=%d", h);
                #     // lv_obj_set_style_transform_zoom(id(image_container), end, LV_PART_MAIN);
                    
                #     lv_anim_t a;
                #     lv_anim_init(&a);
                #     lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_y);
                #     lv_anim_set_var(&a, id(image_container));
                #     lv_anim_set_time(&a, 200);
                #     lv_anim_set_values(&a, start, end);
                #     lv_anim_start(&a);

    - id: timer_page
      bg_color: white
      bg_opa: COVER
      layout:
        type: flex
        flex_flow: row
        flex_align_main: center
        flex_align_cross: center
        # flex_align_track: center
        pad_row: 12px
        pad_column: 12px

      widgets:
        - button:
            id: button_go_home
            floating: true
            align: BOTTOM_RIGHT
            y: -56
            x: -56
            width: 72
            height: 56
            radius: 29
            on_click:
              then:
                - lvgl.page.show: home_page
            widgets:
              - label:
                  align: CENTER
                  text_font: font_icons
                  text_color: text_inverse
                  text: "\ue88a"
        # - button:
        #     id: button_go_home
        #     text: "Go Home"
        #     floating: true
        #     align: BOTTOM_RIGHT
        #     y: -60
        #     x: -60
        #     on_click:
        #       then:
        #         - lvgl.page.show: home_page
        - button:
            id: button_stop_ringing
            text: "Stop Ringing"
            floating: true
            align: BOTTOM_MID
            y: -60
            state:
              disabled: true
            on_click:
              then:
                - lambda: |-
                    for (const auto [key, t] : id(timer_map)) {
                      const auto state = id(timer_states)[key];
                      if (state == "RINGING") {
                        id(set_timer)->execute(t, "COMPLETED");
                      }
                    }
                    id(timer_ringing_sensor).publish_state(false);
                - script.execute: render_timers

        

