    - id: timer_page

      styles: background_style
      bg_opa: COVER

      layout:
        type: flex
        flex_flow: row
        flex_align_main: center
        flex_align_cross: center
        # flex_align_track: center
        pad_row: 12px
        pad_column: 12px

      widgets:
        - button:
            id: button_stop_ringing
            text: "Stop Ringing"
            floating: true
            align: BOTTOM_MID
            y: -60
            <<: *button_error_template_container
            state:
              disabled: true
            on_click:
              then:
                - lambda: |-
                    for (const auto [key, t] : id(timer_map)) {
                      const auto state = id(timer_states)[key];
                      if (state == "RINGING") {
                        id(set_timer)->execute(t, "COMPLETED");
                      }
                    }
                    id(timer_ringing_sensor).publish_state(false);
                - script.execute: render_timers

        

        # SLOT 0
        - container:
            <<: *timer_container_template
            id: timer_slot_0
            hidden: true
            widgets:
              - arc:
                  <<: *timer_arc_template
                  id: timer_arc_0
                  width: 120
                  height: 120
              - label:
                  <<: *timer_label_template
                  id: timer_label_0
              - button:
                  <<: *timer_button_template
                  on_click:
                    then:
                      - script.execute:
                          id: cancel_timer_by_slot_index
                          index: 0

        # SLOT 1
        - container:
            <<: *timer_container_template
            id: timer_slot_1
            hidden: true
            widgets:
              - arc:
                  <<: *timer_arc_template
                  id: timer_arc_1
                  width: 120
                  height: 120
              - label:
                  <<: *timer_label_template
                  id: timer_label_1
              - button:
                  <<: *timer_button_template
                  on_click:
                    then:
                      - script.execute:
                          id: cancel_timer_by_slot_index
                          index: 1

        # SLOT 2
        - container:
            <<: *timer_container_template
            id: timer_slot_2
            hidden: true
            widgets:
              - arc:
                  <<: *timer_arc_template
                  id: timer_arc_2
                  width: 120
                  height: 120
              - label:
                  <<: *timer_label_template
                  id: timer_label_2
              - button:
                  <<: *timer_button_template
                  on_click:
                    then:
                      - script.execute:
                          id: cancel_timer_by_slot_index
                          index: 2

        - container:
            <<: *timer_container_template
            id: timer_static
            hidden: false
            widgets:
              - arc:
                  <<: *timer_arc_template
                  id: timer_arc_static
                  width: 120
                  height: 120
                  value: 16000
              - label:
                  <<: *timer_label_template
                  id: timer_label_static
              - button:
                  <<: *timer_button_template
                  