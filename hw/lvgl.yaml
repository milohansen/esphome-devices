            id: home_assistant_container
            align: TOP_MID
            width: 100%
            height: SIZE_CONTENT
            pad_all: 12px
            radius: 0
            border_width: 0
            
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: end

            widgets:
              - label:
                  id: home_assistant_request_label
                  text: "-"
                  text_font: montserrat_28
                  align: LEFT_MID
                  long_mode: WRAP
                  flex_grow: 1
              - label:
                  id: home_assistant_response_label
                  text: "-"
                  text_font: montserrat_28
                  text_align: right
                  align: RIGHT_MID
                  long_mode: WRAP
                  flex_grow: 1

        - container:
            id: image_container
            align: TOP_LEFT
            x: 0
            y: 0
            width: 100%
            height: 100%
            radius: 0
            pad_all: 0
            border_width: 0
            scrollable: true
            scroll_dir: hor
            scroll_snap_x: "START"
            scrollbar_mode: "OFF"
            scroll_one: true
            scroll_elastic: false
            
            shadow_spread: 4

            layout:
              type: flex
              flex_flow: row
              flex_align_main: start
              flex_align_track: start
              flex_align_cross: stretch

            on_boot:
              - lambda: |-
                  lv_obj_scroll_to_x(id(image_container), 0, LV_ANIM_OFF);

            on_scroll_begin:
              - switch.turn_on: slideshow_scrolling
            on_scroll_end:
              - delay: 25ms
              - switch.turn_off: slideshow_scrolling

            widgets:
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_0
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_0
                        src: placeholder_image
                    - image:
                        <<: *image_template
                        id: background_image_0_b
                        src: placeholder_image_half
                        hidden: true
                    - label:
