# --- WIDGET TEMPLATING -------------------------------------------------------

.button_template: &button_template
  styles: primary_style
  pressed:
    styles: primary_style
  disabled:
    styles: surface_var_style
  checked:
    styles: primary_container_style
.button_template_container: &button_template_container
  styles: primary_container_style
  pressed:
    styles: primary_container_style
  disabled:
    styles: surface_var_style
  checked:
    styles: primary_style

.button_secondary_template: &button_secondary_template
  styles: secondary_style
  pressed:
    styles: secondary_style
  disabled:
    styles: surface_var_style
  checked:
    styles: secondary_container_style
.button_secondary_template_container: &button_secondary_template_container
  styles: secondary_container_style
  pressed:
    styles: secondary_container_style
  disabled:
    styles: surface_var_style
  checked:
    styles: secondary_style

.button_tertiary_template: &button_tertiary_template
  styles: tertiary_style
  pressed:
    styles: tertiary_style
  disabled:
    styles: surface_var_style
  checked:
    styles: tertiary_container_style
.button_tertiary_template_container: &button_tertiary_template_container
  styles: tertiary_container_style
  pressed:
    styles: tertiary_container_style
  disabled:
    styles: surface_var_style
  checked:
    styles: tertiary_style

.button_error_template: &button_error_template
  styles: error_style
  pressed:
    styles: error_style
  disabled:
    styles: surface_var_style
  checked:
    styles: error_container_style
.button_error_template_container: &button_error_template_container
  styles: error_container_style
  pressed:
    styles: error_container_style
  disabled:
    styles: surface_var_style
  checked:
    styles: error_style

.text_shadow_template: &text_shadow_template
  styles: text_shadow_style
 
# ESPHome hidden items for widget templates
# IMAGES
.image_container_template: &image_container_template
  height: ${screenheight}
  width: ${screenwidth}
  snappable: true
  clip_corner: true
  bg_color: black
  bg_opa: COVER
  layout:
    type: flex
    flex_flow: row
    flex_align_main: center
    flex_align_cross: center
    pad_column: 4

.image_template: &image_template
  height: ${screenheight}

.image_label_template: &image_label_template
  text_font: "montserrat_42"
  text_color: white
  floating: true

# TIMERS
.timer_container_template: &timer_container_template
  # height: SIZE_CONTENT
  width: 300px
  height: 350px
  bg_color: white
  bg_opa: COVER
  radius: 4px
  border_width: 1
  # layout: vertical

.timer_arc_template: &timer_arc_template
  width: 300
  height: 300
  value: 32767
  min_value: 0
  max_value: 32767
  arc_width: 5
  adjustable: false
  start_angle: 0
  end_angle: 360
  rotation: 270
  align: CENTER
  adv_hittest: true
  styles: surface_arc_style
  bg_opa: 0%
  indicator:
    styles: primary_arc_style
    bg_opa: 0%
  # arc_color: 0x4F46E5
  # arc_opa: 50%
  # arc_opa: 0%

.timer_label_template: &timer_label_template
  text: "0:00"
  text_color: 0x4F46E5
  text_align: CENTER
  long_mode: SCROLL
  text_font: montserrat_20
  floating: true
  align: CENTER
  <<: *button_template_container
  bg_opa: 0

.timer_button_template: &timer_button_template
  text: "Cancel"
  text_font: montserrat_14
  # y: 40
  # height: 30
  # width: 80
  floating: true
  align: BOTTOM_MID
  # bg_color: 0xE0E7FF
  # text_color: 0x4338CA
  # radius: 4px
  border_width: 0
  <<: *button_secondary_template_container


# --- LVGL CONFIGURATION --------------------------------------------------------
lvgl:
  id: lvgl_component
  displays: main_display
  touchscreens: my_touchscreen
  buffer_size: 100%
  byte_order: little_endian

  disp_bg_color: black
  disp_bg_opa: COVER

  # log_level: info

  on_boot:
    - lambda: |-
        ESP_LOGI("lvgl", "LVGL initialized");
        id(debug_widgets).clear();
        id(debug_widgets).push_back(id(debug_label));
        id(debug_widgets).push_back(id(debug_spinner));
        id(debug_widgets).push_back(id(test_container));
        id(debug_widgets).push_back(id(button_fetch));
        id(debug_widgets).push_back(id(label_image_0));
        id(debug_widgets).push_back(id(label_image_1));
        id(debug_widgets).push_back(id(label_image_2));
        id(debug_widgets).push_back(id(label_image_3));
        id(debug_widgets).push_back(id(label_image_4));
        id(debug_widgets).push_back(id(label_image_5));
    - script.execute: set_debug_visibility

  style_definitions:
    - id: image_style
      radius: 0

    - id: primary_style
      bg_color: primary_color
      text_color: on_primary_color
      arc_color: primary_color
    - id: primary_container_style
      bg_color: primary_container_color
      text_color: on_primary_container_color
      arc_color: primary_container_color

    - id: secondary_style
      bg_color: secondary_color
      text_color: on_secondary_color
      arc_color: secondary_color
    - id: secondary_container_style
      bg_color: secondary_container_color
      text_color: on_secondary_container_color
      arc_color: secondary_container_color

    - id: tertiary_style
      bg_color: tertiary_color
      text_color: on_tertiary_color
      arc_color: tertiary_color
    - id: tertiary_container_style
      bg_color: tertiary_container_color
      text_color: on_tertiary_container_color
      arc_color: tertiary_container_color

    - id: error_style
      bg_color: error_color
      text_color: on_error_color
    - id: error_container_style
      bg_color: error_container_color
      text_color: on_error_container_color

    - id: background_style
      bg_color: background_color
      text_color: on_background_color
    - id: surface_style
      bg_color: surface_color
      text_color: on_surface_color
    - id: surface_var_style
      bg_color: surface_var_color
      text_color: on_surface_var_color
    - id: inverse_surface_style
      bg_color: inverse_surface_color
      text_color: on_inverse_surface_color

    - id: shadow_style
      shadow_color: shadow_color
    - id: text_shadow_style
      text_color: shadow_color
    - id: outline_style
      arc_color: outline_color
      border_color: outline_color
    - id: outline_var_style
      arc_color: outline_var_color
      border_color: outline_var_color

    - id: primary_arc_style
      arc_color: primary_color
    - id: secondary_arc_style
      arc_color: secondary_color
    - id: surface_arc_style
      arc_color: surface_color

  # Warm earthy palette inspired by palette-2.css
  # Colors: Terracotta primary, Stone neutrals, Olive/Mustard/Brick accents
  theme:
    # Base object styling
    obj:
      bg_color: background_surface
      text_color: text_main
      border_color: border_color
      shadow_color: shadow_color
      
    # Button styling
    button:
      bg_color: primary_base
      text_color: text_inverse
      radius: 8
      border_width: 0
      shadow_width: 4
      shadow_opa: 20%
      pressed:
        bg_color: primary_active
      checked:
        bg_color: secondary_base
        text_color: text_inverse
      disabled:
        bg_color: border_color
        text_color: text_muted
    
    # Button matrix styling
    buttonmatrix:
      bg_color: background_surface
      border_color: border_color
      items:
        bg_color: primary_base
        text_color: text_inverse
        pressed:
          bg_color: primary_active
        checked:
          bg_color: secondary_base
          text_color: text_inverse
    
    # Checkbox styling
    checkbox:
      bg_color: background_page
      border_color: primary_base
      radius: 4
      checked:
        bg_color: primary_base
        border_color: primary_base
    
    # Switch styling  
    switch:
      bg_color: border_color
      border_color: primary_base
      indicator:
        bg_color: primary_base
    
    # Slider styling
    slider:
      bg_color: border_color
      main:
        bg_color: primary_base
      indicator:
        bg_color: secondary_base
      knob:
        bg_color: background_page
        border_color: primary_base
        border_width: 2
        radius: 1000
    
    # Arc styling
    arc:
      arc_color: border_color
      arc_width: 8
      indicator:
        arc_color: primary_base
        arc_width: 8
      knob:
        bg_color: background_page
        border_color: primary_base
        border_width: 2
    
    # Dropdown styling
    dropdown:
      bg_color: background_page
      text_color: text_main
      border_color: border_color
      indicator:
        text_color: text_main
    
    # Roller styling
    roller:
      bg_color: background_page
      text_color: text_main
      selected:
        bg_color: primary_base
        text_color: text_inverse
    
    # Spinner styling
    spinner:
      arc_color: primary_base
      indicator:
        arc_color: secondary_base
    
    # Textarea styling
    textarea:
      bg_color: background_page
      text_color: text_main
      border_color: border_color
      cursor:
        bg_color: text_main
      selected:
        bg_color: primary_hover
        text_color: text_main
    
    # Label styling
    label:
      text_color: text_main
    
    # Line styling
    line:
      line_color: primary_base
      line_width: 2
    
    # Bar styling
    bar:
      bg_color: border_color
      indicator:
        bg_color: primary_base
    
    # Meter styling
    meter:
      bg_color: background_surface
      border_color: border_color
      indicator:
        line_color: secondary_base
        arc_color: primary_base


