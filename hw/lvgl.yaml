                  id: timer_label_1
              - button:
                  <<: *timer_button_template
                  on_click:
                    then:
                      - script.execute:
                          id: cancel_timer_by_slot_index
                          index: 1

        # SLOT 2
        - container:
            <<: *timer_container_template
            id: timer_slot_2
            hidden: true
            widgets:
              - arc:
                  <<: *timer_arc_template
                  id: timer_arc_2
                  width: 120
                  height: 120
              - label:
                  <<: *timer_label_template
                  id: timer_label_2
              - button:
                  <<: *timer_button_template
                  on_click:
                    then:
                      - script.execute:
                          id: cancel_timer_by_slot_index
                          index: 2

        - led:
            id: assistant_connected_led
            floating: true
            align: TOP_RIGHT
            y: 60
            x: -60
            color: text_muted

    

