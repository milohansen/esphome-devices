                        id: background_image_2
                        src: placeholder_image
                    - image:
                        <<: *image_template
                        id: background_image_2_b
                        src: placeholder_image_half
                        hidden: true
                    - label:
                        <<: *image_label_template
                        id: label_image_2
                        text: "2"
              - container:
