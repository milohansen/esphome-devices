# Material Theme Integration Example
# 
# This example shows how to use the material_theme component
# with your ESPHome voice assistant display

# Add to your packages section
packages:
  # ... existing packages ...
  material_theme: !include components/material_theme_config.yaml

# Example: Configure Material Theme component
material_theme:
  id: theme
  source_color: 0xFF2A9D8F  # Pacific Teal (current primary color)
  is_dark: false
  contrast_level: 0.0
  variant: TONAL_SPOT  # Options: TONAL_SPOT, VIBRANT, EXPRESSIVE, CONTENT, MONOCHROME, NEUTRAL

# Example: Generate scheme on button press
button:
  - platform: template
    name: "Regenerate Theme"
    on_press:
      - material_theme.generate_scheme:
          id: theme
          source_color: 0xFF6366F1  # Indigo
          is_dark: false
  - platform: template
    name: "Apply Theme"
    on_press:
      - script.execute: apply_image_colors

select:
  - id: color_scheme_variant
    platform: template
    name: "Material Theme Color Variant"
    icon: "mdi:palette"
    # entity_category: config
    optimistic: true
    # restore_value: true
    options:
      - Tonal Spot
      - Vibrant
      - Expressive
      - Content
      - Monochrome
      - Neutral
    initial_option: Content
    on_value:
      - lambda: |-
          ESP_LOGD("material_theme", "Color scheme variant changed to: %s", x.c_str());
          material_theme::SchemeVariant variant;
          if (x == "Tonal Spot") {
            variant = material_theme::VARIANT_TONAL_SPOT;
          } else if (x == "Vibrant") {
            variant = material_theme::VARIANT_VIBRANT;
          } else if (x == "Expressive") {
            variant = material_theme::VARIANT_EXPRESSIVE;
          } else if (x == "Content") {
            variant = material_theme::VARIANT_CONTENT;
          } else if (x == "Monochrome") {
            variant = material_theme::VARIANT_MONOCHROME;
          } else if (x == "Neutral") {
            variant = material_theme::VARIANT_NEUTRAL;
          } else {
            ESP_LOGW("material_theme", "Unknown variant selected: %s", x.c_str());
            return;
          }
          id(material_theme_component).set_variant(variant);
      # - script.execute: apply_image_colors

# Example: Generate theme from Home Assistant entity color
binary_sensor:
  - platform: homeassistant
    entity_id: light.living_room
    attribute: rgb_color
    on_press:
      - lambda: |-
          // Extract RGB from HA light entity and generate scheme
          auto rgb = id(light_entity).state;
          uint32_t color = 0xFF000000 | 
            (static_cast<uint8_t>(rgb[0]) << 16) |
            (static_cast<uint8_t>(rgb[1]) << 8) |
            static_cast<uint8_t>(rgb[2]);
          
          id(theme).generate_scheme(color, false, 0.0, material_theme::VARIANT_VIBRANT);

# Example: Apply scheme to LVGL on generation
esphome:
  on_boot:
    priority: -100  # After LVGL initialized
    then:
      - lambda: |-
          // Register callback to apply scheme to LVGL when generated
          id(theme).add_on_scheme_generated_callback([](const material_theme::ColorScheme &scheme) {
            ESP_LOGI("theme", "New color scheme generated, applying to LVGL");
            
            #ifdef USE_LVGL
            auto *lvgl_comp = id(main_display);  // Your LVGL component ID
            material_theme::LVGLThemeApplicator::apply_scheme_to_lvgl(lvgl_comp, scheme, false);
            #endif
          });

# Example: Update specific LVGL widgets with Material colors
lvgl:
  on_idle:
    - lambda: |-
        auto scheme = id(theme).get_current_scheme();
        
        // Apply to specific widget
        auto *my_button = id(lvgl_button);
        lv_obj_set_style_bg_color(my_button, 
          material_theme::LVGLThemeApplicator::argb_to_lv_color(scheme.primary),
          LV_PART_MAIN);
        lv_obj_set_style_text_color(my_button,
          material_theme::LVGLThemeApplicator::argb_to_lv_color(scheme.on_primary),
          LV_PART_MAIN);
        
        // Apply Material elevation
        material_theme::LVGLThemeApplicator::apply_elevation(my_button, 2);

# Example: Generate scheme based on time of day
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Switch to dark theme at sunset
      - hours: 19
        minutes: 0
        then:
          - material_theme.generate_scheme:
              id: theme
              is_dark: true
      # Switch to light theme at sunrise
      - hours: 7
        minutes: 0
        then:
          - material_theme.generate_scheme:
              id: theme
              is_dark: false

