gemini_live:
  id: gemini_live_component
  microphone: box_mic
  speaker: box_speaker
  connection_type: bridge # direct or bridge
  model: "gemini-2.5-flash-native-audio-preview-12-2025"
  gemini_token: gemini_token
  gemini_config: gemini_config
  on_stop_streaming:
    - logger.log: "Gemini has stopped streaming!"
    - binary_sensor.template.publish:
        id: assistant_active
        state: false
    - micro_wake_word.start:

text_sensor:
  - platform: template
    id: gemini_token
    name: "Gemini Token"
  - platform: template
    id: gemini_config
    name: "Gemini Config"

# Example Triggers
# You must adjust the IP address to point to your Home Assistant Add-on IP.
# Usually this is the Home Assistant server IP.

wifi:
  on_connect:
    then:
      - logger.log:
          format: "WiFi connected, initializing Gemini Live Component in bridge mode"
          level: DEBUG
          tag: "gemini"
      - lambda: |-
          if (id(gemini_live_component)->get_connection_type() == "bridge") {
            std::string proxy_ip = "192.168.1.192:7000";
            id(gemini_live_component)->initialize(proxy_ip);
            ESP_LOGD("gemini", "Initialized Gemini Live Component in bridge mode");
          } else {
            id(gemini_live_component)->initialize();
            ESP_LOGD("gemini", "Initialized Gemini Live Component in direct mode");
          }

micro_wake_word:
  on_wake_word_detected:
    - logger.log:
        format: "Wake Word detected!"
        level: DEBUG
        tag: "gemini"
    - lambda: |-
        // CHANGE THIS IP:
        // std::string proxy_ip = "192.168.1.100"; 
        // std::string proxy_ip = "192.168.1.192:7000"; 
        // std::string proxy_ip = "http://homeassistant.local:7000"; 
        id(gemini_live_component)->start_streaming();
        ESP_LOGD("gemini", "Wake Word detected - Starting Stream");

# Stop stream on silence or button press
# Example: If you have a binary_sensor for a button
# binary_sensor:
#   - id: boot_button
#     on_press:
#       - lambda: id(gemini_live_component)->stop_streaming();

button:
  - id: start_voice_assist_btn
    platform: template
    name: "Gemini Voice Assist - Start"
    on_press:
      - logger.log: "Start Voice Assist button pressed"
      - binary_sensor.template.publish:
          id: assistant_active
          state: true
      - micro_wake_word.stop:
      - lambda: id(gemini_live_component)->start_streaming();
      
  - id: end_voice_assist_btn
    platform: template
    name: "Gemini Voice Assist - Stop"
    on_press:
      - logger.log: "End Voice Assist button pressed"
      - binary_sensor.template.publish:
          id: assistant_active
          state: false
      - lambda: id(gemini_live_component)->stop_streaming();
      - micro_wake_word.start:
      - script.execute: set_idle_or_mute_phase
