gemini_live:
  id: gemini_live_component
  microphone: box_mic
  speaker: box_speaker

# Example Triggers
# You must adjust the IP address to point to your Home Assistant Add-on IP.
# Usually this is the Home Assistant server IP.

micro_wake_word:
  on_wake_word_detected:
    - lambda: |-
        // CHANGE THIS IP:
        // std::string proxy_ip = "192.168.1.100"; 
        std::string proxy_ip = "http://homeassistant.local:7000"; 
        id(gemini_live_component)->start_streaming(proxy_ip);
        ESP_LOGD("gemini", "Wake Word detected - Starting Stream");

# Stop stream on silence or button press
# Example: If you have a binary_sensor for a button
# binary_sensor:
#   - id: boot_button
#     on_press:
