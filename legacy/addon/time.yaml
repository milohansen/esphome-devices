time:
  - platform: rx8130
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
    timezone: America/New_York
    address: 0x14
    i2c_id: bus_a
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/New_York
    on_time_sync:
      then:
        # Write time to RTC
        - rx8130.write_time:
