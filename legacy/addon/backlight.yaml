
# --- BACKLIGHT ----------------------------------------------------------------
output:
  - id: backlight_output
    platform: ledc
    pin: GPIO23
    frequency: 100Hz
    inverted: false
    min_power: 0.0
    max_power: 0.8

light:
  - id: Sled
    platform: monochromatic
    name: Screen
    icon: mdi:television
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
    gamma_correct: 1.0
