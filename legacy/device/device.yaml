esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: false
  on_boot:
    then:
      # read the RTC time once when the system boots
      rx8130.read_time:
  includes:
    - va_helpers.h

ota:
  - id: ota_esphome
    platform: esphome
    on_begin: 
      then:
        - lvgl.widget.show: updating_screen
        - logger.log:
            level: INFO
            format: "OTA Start"
        - lvgl.widget.redraw: updating_screen

api:
  id: ha_api
  homeassistant_services: true
