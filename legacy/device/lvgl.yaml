# --- WIDGET TEMPLATING -------------------------------------------------------
substitutions:
  container_height: "600px"
  label_font: "montserrat_42"
  
# ESPHome hidden items for widget templates
.image_container_template: &image_container_template
  height: ${container_height}
  width: SIZE_CONTENT
  snappable: true

.image_template: &image_template
  height: ${container_height}
  clip_corner: true

.image_label_template: &image_label_template
  text_font: ${label_font}
  floating: true

.timer_container_template: &timer_container_template
  height: SIZE_CONTENT
  width: SIZE_CONTENT
  bg_color: white
  bg_opa: COVER
  radius: 8px
  layout: vertical

.timer_arc_template: &timer_arc_template
  width: 100
  height: 100
  value: 100
  min_value: 0
  max_value: 100
  adjustable: false
  start_angle: 0
  end_angle: 360
  rotation: 135
  arc_color: 0x4F46E5

.timer_label_template: &timer_label_template
  text: "0:00"
  text_color: 0x4F46E5
  text_align: CENTER
  long_mode: SCROLL
  text_font: montserrat_20
  floating: true
  align: CENTER

.timer_button_template: &timer_button_template
  text: "Cancel"
  text_font: montserrat_14
  y: 40
  height: 30
  width: 80
  floating: true
  align: CENTER
  bg_color: 0xE0E7FF
  text_color: 0x4338CA
  radius: 4px
  border_width: 0


# --- LVGL CONFIGURATION --------------------------------------------------------
lvgl:
  displays: main_display
  touchscreens: my_touchscreen
  buffer_size: 100%
  byte_order: little_endian

  disp_bg_color: black

  style_definitions:
    - id: image_style
      radius: 0

  top_layer:
    widgets:
      - container:
          id: time_date_container
          scrollable: false
          height: SIZE_CONTENT
          width: SIZE_CONTENT
          # width: 1024px
          floating: true
          align: BOTTOM_LEFT
          x: 60
          y: -60
          layout:
            type: flex
            flex_flow: column_reverse
            flex_align_main: start
            flex_align_cross: start
            flex_align_track: start
          widgets:
            - label:
                id: time_label
                text:
                  format: "%d:%02d"
                  args: ['id(homeassistant_time).now().hour % 12 == 0 ? 12 : id(homeassistant_time).now().hour % 12', id(homeassistant_time).now().minute]
                text_font: font_big_clock
                text_align: left
                text_color: white
                on_boot:
                  lvgl.widget.refresh: time_label
            - label:
                id: date_label
                text:
                  time_format: "%a, %b %d"
                  time: !lambda return id(homeassistant_time).now();
                text_font: font_big_date
                text_align: left
                text_color: white
                on_boot:
                  lvgl.widget.refresh: date_label
      - obj:
          id: assistant_container
          # x: 256
          # y: -6
          y: -42px
          align: TOP_MID
          min_width: 256px
          width: SIZE_CONTENT
          height: 42px
          bg_color: white
          bg_opa: COVER
          radius: 6px
          pad_all: 3px
          pad_top: 9px
          border_width: 0
          layout:
            type: flex
            flex_flow: row
            flex_align_main: space_between
            flex_align_cross: end
            pad_column: 12px
          widgets:
            - label:
                id: assistant_request_label
                text: "-"
                text_font: montserrat_28
                align: BOTTOM_LEFT
            - label:
                id: assistant_response_label
                text: "-"
                text_font: montserrat_28
                align: BOTTOM_RIGHT
            # - label:
            #     id: assistant_state_label
            #     text: "Idle"
            #     text_font: montserrat_28
            #     text_align: center
            #     align: BOTTOM_MID
      - obj:
          id: updating_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: black
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          hidden: true
          widgets:
            - label:
                id: updating_label
                text: "Updating..."
                text_font: font_big_clock
                text_align: left
                text_color: white
                x: 128
                y: 128
  pages:
    - id: home_page
      bg_color: black
      bg_opa: COVER
      widgets:
        - container:
            id: image_container
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_color: black
            bg_opa: COVER
            radius: 0
            pad_all: 0
            border_width: 0
            scrollable: true
            scroll_dir: hor
            scroll_snap_x: "START"
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: row
              flex_align_main: start
              flex_align_track: start
              flex_align_cross: stretch

            on_boot:
              - lambda: |-
                  id(image_map)[0] = id(image_subcontainer_0);
                  id(image_map)[1] = id(image_subcontainer_1);
                  id(image_map)[2] = id(image_subcontainer_2);
                  id(image_map)[3] = id(image_subcontainer_3);
                  id(image_map)[4] = id(image_subcontainer_4);
                  id(image_map)[5] = id(image_subcontainer_5);

            # on_scroll_begin:
            #   - logger.log: "Scroll started"
            #   - switch.turn_on: lvgl_switch
            on_scroll_end:
              # - logger.log: "Scroll ended"
              # - switch.turn_off: lvgl_switch
              - lambda: |-
                  int16_t x_pos = lv_obj_get_scroll_x(id(image_container));
                  ESP_LOGD("lvgl", "Scroll ended at x=%d", x_pos);

            widgets:
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_0
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_0
                        src: image_0
                        # width: 890px
                        on_click:
                          then:
                            - logger.log: "Image 0 clicked"
                    - label:
                        <<: *image_label_template
                        text: "0"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_1
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_1
                        src: image_1
                        # width: 870px
                        # on_boot:
                        #   - lambda |-
                        #       int img_w = id(my_image_id).get_width();
                        #       lv_obj_set_width(background_image_1, img_w);
                    - label:
                        <<: *image_label_template
                        text: "1"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_2
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_2
                        src: image_0
                    - label:
                        <<: *image_label_template
                        text: "2"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_3
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_3
                        src: landscape
                    - label:
                        <<: *image_label_template
                        text: "3"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_4
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_4
                        src: crow
                    - label:
                        <<: *image_label_template
                        text: "4"
              - container:
                  <<: *image_container_template
                  id: image_subcontainer_5
                  widgets:
                    - image:
                        <<: *image_template
                        id: background_image_5
                        src: owl
                    - label:
                        <<: *image_label_template
                        text: "5"

        - button:
            id: button_next
            text: "Next"
            floating: true
            align: BOTTOM_RIGHT
            x: -60
            y: -60
            on_click:
              then:
                - lambda: |-
                    // TODO: Keep one previous image and one next image loaded to allow smooth scrolling
                    const int map_size = id(image_map).size();
                    // Increment image index and wrap around
                    id(image_index) = (id(image_index) + 1) % map_size;
                    auto img = id(image_map)[id(image_index)];
                    int width = lv_obj_get_width(img);

                    ESP_LOGD("custom", "Next button clicked, scrolling to index: %d (width: %d)", id(image_index), width);

                    // scroll to the next image
                    lv_obj_scroll_to_x(id(image_container), width, LV_ANIM_ON);

                - lvgl.widget.redraw: image_container
                - delay: 1s
                - lambda: |-
                    const int map_size = id(image_map).size();
                    // static int index = 0;
                    const int index = id(image_index);
                    ESP_LOGD("custom", "%s: %d", "Next button clicked, current index", index);
                    
                    auto img = id(image_map)[index];
                    // index = (index + 1) % map_size;

                    if (img != nullptr) {
                        ESP_LOGD("custom", "Found image at index %d: Pointer %p", index, img);
                    } else {
                        ESP_LOGE("debug", "Key not found in map!");
                    }
                    lv_obj_move_to_index(img, map_size - 1);
                    lv_obj_scroll_to_x(id(image_container), 0, LV_ANIM_OFF);
                    id(replace_this_image_index) = index;
                    // TODO: FIGURE OUT HOW TO REPLACE THE IMAGE HERE
                - lvgl.widget.redraw: image_container
        - obj:
            id: timer_container
            # x: 256
            # y: -6
            x: 6px
            align: RIGHT_MID
            
            height: SIZE_CONTENT
            width: SIZE_CONTENT
            bg_color: white
            bg_opa: 50%
            radius: 6px
            pad_all: 3px
            pad_right: 9px
            border_width: 0
            widgets:
              - label:
                  id: timer_list
                  text: "-"
                  hidden: true

              # SLOT 0
              - container:
                  <<: *timer_container_template
                  id: timer_slot_0
                  hidden: true
                  widgets:
                    - arc:
                        <<: *timer_arc_template
                        id: timer_arc_0
                        width: 120
                        height: 120
                    - label:
                        <<: *timer_label_template
                        id: timer_label_0
                    - button:
                        <<: *timer_button_template
                        on_click:
                          then:
                            - lambda: |-
                                my_va::cancel_timer_safely(id(va), id(timer_slot_0_id));

              # SLOT 1
              - container:
                  <<: *timer_container_template
                  id: timer_slot_1
                  hidden: true
                  widgets:
                    - arc:
                        <<: *timer_arc_template
                        id: timer_arc_1
                        width: 120
                        height: 120
                    - label:
                        <<: *timer_label_template
                        id: timer_label_1
                    - button:
                        <<: *timer_button_template
                        # on_click:
                        #   then:
                        #     - lambda: |-
                        #         my_va::cancel_timer_with_ha(id(timer_slot_1_id), id(timer_map), id(ha_api), id(va));

              # SLOT 2
              - container:
                  <<: *timer_container_template
                  id: timer_slot_2
                  hidden: true
                  widgets:
                    - arc:
                        <<: *timer_arc_template
                        id: timer_arc_2
                        width: 120
                        height: 120
                    - label:
                        <<: *timer_label_template
                        id: timer_label_2
                    - button:
                        <<: *timer_button_template
                        # on_click:
                        #   then:
                        #     - lambda: |-
                        #         my_va::cancel_timer_with_ha(id(timer_slot_2_id), id(timer_map), id(ha_api), id(va));

        - obj:
            id: snap_buttons
            x: 60
            y: 60
            # height: 300px
            layout: vertical
            hidden: true
            widgets:
              - button:
                  id: button_1
                  text: "First"
                  on_click:
                    then:
                      - lambda: |-
                          lv_obj_scroll_to_x(id(image_container), 0, LV_ANIM_ON);
                      - lvgl.widget.redraw: image_container
              - button:
                  id: button_2
                  text: "Second"
                  on_click:
                    then:
                      - lambda: |-
                          lv_obj_scroll_to_x(id(image_container), 900, LV_ANIM_ON);
                      - lvgl.widget.redraw: image_container
              # - button:
              #     id: button_3
              #     text: "ADD"
              #     on_click:
              #       then:
              #         - lambda: |-
              #             # Create a new label widget dynamically
              #             lv_obj_t * label = lv_label_create(id(image_container));
              #             lv_label_set_text(label, "Dynamically Added!");
              #             lv_obj_center(label);
              #         - lvgl.widget.redraw: image_container
              # - button:
              #     id: snap_end_button
              #     text: "END"
