              #       then:
              #         - lvgl.widget.update:
              #             id: background_image
              #             snappable: true
              #             # scroll_snap_x: "END"
              #         - lvgl.widget.update:
              #             id: background_image_2
              #             snappable: true
              #             # scroll_snap_x: "END"
