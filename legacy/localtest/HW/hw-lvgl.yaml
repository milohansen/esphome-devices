
# Guition 7.0 p4 (JC1060P470C_I_W_Y) hardware pack v1.01

# --- CLOCKS PACKAGE -----------------------------------------------------------
packages:
  clocks: !include ../clocks-lvgl.yaml

# --- WIDGET TEMPLATING -------------------------------------------------------
substitutions:
  container_height: "600px"
  label_font: "montserrat_42"
  
# ESPHome hidden items for widget templates
.image_container_template: &image_container_template
  height: ${container_height}
  width: SIZE_CONTENT
  snappable: true

.image_template: &image_template
  height: ${container_height}
  clip_corner: true

.image_label_template: &image_label_template
  text_font: ${label_font}
  floating: true

.timer_container_template: &timer_container_template
  height: SIZE_CONTENT
  width: SIZE_CONTENT
  bg_color: white
  bg_opa: COVER
  radius: 8px
  layout: vertical

.timer_arc_template: &timer_arc_template
  width: 100
  height: 100
  value: 100
  min_value: 0
  max_value: 100
  adjustable: false
  start_angle: 0
  end_angle: 360
  rotation: 135
  arc_color: 0x4F46E5

.timer_label_template: &timer_label_template
  text: "0:00"
  text_color: 0x4F46E5
  text_align: CENTER
  long_mode: SCROLL
  text_font: montserrat_20
  floating: true
  align: CENTER

.timer_button_template: &timer_button_template
  text: "Cancel"
  text_font: montserrat_14
  y: 40
  height: 30
  width: 80
  floating: true
  align: CENTER
  bg_color: 0xE0E7FF
  text_color: 0x4338CA
  radius: 4px
  border_width: 0

# --- BUSES / PERIPHERALS ------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz

  - id: sensor_bus
    sda: GPIO46
    scl: GPIO45

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x36

