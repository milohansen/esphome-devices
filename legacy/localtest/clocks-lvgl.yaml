select:
  - id: clock_style
    platform: template
    entity_category: config
    name: "Clock Style"
    icon: "mdi:clock-digital"
    optimistic: true
    restore_value: true
    options:
      - Default
      - Presence
    initial_option: Default
    # on_value:
    #   - if:
    #       condition:
    #         lambda: return id(show_clock);
    #       then:
    #         - script.execute: show_clock_page

  - id: clock_wallpaper_image
    platform: template
    entity_category: config
    name: "Clock Wallpaper (Online)"
    icon: "mdi:image"
    optimistic: true
    restore_value: true
    options:
      - starrysky
      - none
    initial_option: ${clock_background_image}
    on_value:
      - online_image.set_url:
          id: clock_background
          url: !lambda |-
            if (x == "none") {
              return "https://placehold.co/1024x600/000000/000000.png";
            } else {
              std::string base = "${imagepath}/Other/"
                               "${screenwidth}x${screenheight}/";
              return base + std::string(x) + ".png";
            }
          update: true
      # - component.update: main_display

