esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - script.execute: draw_display
      # - delay: 30s
      # - if:
      #     condition:
      #       lambda: return id(init_in_progress);
      #     then:
      #       - lambda: id(init_in_progress) = false;
      #       - script.execute: draw_display

ota:
  - id: ota_esphome
    platform: esphome
    on_begin: 
      then:
        - display.page.show: updating_page
        - component.update: main_display

logger:
  level: WARN

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: "RZ7D3EzJdPM6"
  on_connect:
    - component.update: clock_background
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

http_request:

online_image:
  - id: clock_background
    url: ${clock_background_file}
    format: PNG
    type: RGB565
    resize: ${screenwidth}x${screenheight}
    update_interval: never

  - id: temp_fullscreen
    url: ${clock_background_file}
    format: PNG
    type: RGB565
    resize: ${screenwidth}x${screenheight}
    update_interval: never

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                lambda: return id(show_clock) && !id(clock_show_seconds).state;
              then:
                - component.update: main_display

api:
  on_client_connected:
    - script.execute: draw_display
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(play_sound)->execute(true, id(ready_sound));
          }
        }
    - script.execute: reset_screensaver
  on_client_disconnected:
    - script.execute: draw_display

  actions:
    - action: show_fullscreen_image
      variables:
        url: string
      then:
        - if:
            condition:
              lambda: |-
                return id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                    || id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
            then:
              - lambda: id(showing_fullscreen_image) = true;
              - online_image.set_url:
                  id: temp_fullscreen
                  url: !lambda 'return url;'
                  update: true
              - delay: 600ms
              - display.page.show: empty_clock
              - component.update: main_display
              - script.execute: reset_screensaver
              - delay: !lambda |-
                  int s = (int) id(api_image_duration_seconds).state;
                  if (s <= 0) s = 30;
                  return (uint32_t)(s * 1000);
              - online_image.release: temp_fullscreen
              - lambda: id(showing_fullscreen_image) = false;
              - script.execute: draw_display
            else:
              - logger.log:
                  level: INFO
                  format: "show_fullscreen_image ignored (phase=%d)"
                  args: [ 'id(voice_assistant_phase)' ]

button:
  - id: factory_reset_btn
    platform: factory_reset
    internal: true

  - id: virtual_touch
    platform: template
    name: "Virtual Touch"
    on_press:
      - script.execute: handle_screen_tap
  # - id: show_page
  #   platform: template
  #   name: "Show Page"

  #   on_press:
  #     - script.execute: handle_screen_tap

number:
  - id: clock_delay_seconds
    platform: template
    name: "Clock Screensaver Delay"
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 10

  - id: api_image_duration_seconds
    platform: template
    name: "API Image Display Time"
    unit_of_measurement: "s"
    icon: "mdi:timer-sand"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 30

