font: !include core/fonts.yaml

text_sensor:
  - id: text_request
    name: "Text Request"
    platform: template
    on_value:
      lambda: |-
        auto &s = id(text_request).state;
        if (s.length() > 30) {
          s.resize(30);
          s += "...";
        }

  - id: text_response
    name: "Text Response"
    platform: template
    on_value:
      lambda: |-
        auto &s = id(text_response).state;
        if (s.length() > 30) {
          s.resize(30);
          s += "...";
        }

  - id: voice_assistant_phase_sensor
    platform: template
    name: "Voice Assistant Phase ID"
    update_interval: never

  - id: ha_weather_temperature_unit
    platform: homeassistant
    entity_id: ${weather_entity}
    attribute: temperature_unit
    internal: true

  - id: ha_weather_wind_speed_unit
    platform: homeassistant
    entity_id: ${weather_entity}
    attribute: wind_speed_unit
    internal: true

  - id: ha_weather_pressure_unit
    platform: homeassistant
    entity_id: ${weather_entity}
    attribute: pressure_unit
    internal: true

color:
  - id: idle_color
    hex: ${loading_illustration_background_color}
  - id: listening_color
    hex: ${listening_illustration_background_color}
  - id: thinking_color
    hex: ${thinking_illustration_background_color}
  - id: replying_color
    hex: ${replying_illustration_background_color}
  - id: loading_color
    hex: ${loading_illustration_background_color}
  - id: error_color
    hex: ${error_illustration_background_color}
  - id: active_timer_color
    hex: "26ed3a"
  - id: paused_timer_color
    hex: "3b89e3"
  - id: seconds_dot_color
    hex: "3b89e3"
