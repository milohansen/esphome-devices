binary_sensor:
  - id: touch_input
    platform: template
    name: "Touch Button"
    on_click:
      min_length: 30ms
      max_length: 600ms
      then:
        - if:
            condition:
              switch.is_on: timer_ringing
            then:
              - switch.turn_off: timer_ringing
            else:
              - if:
                  condition:
                    lambda: return id(wake_word_engine_location).current_option() == "On device";
                  then:
                    - media_player.stop:
                        id: external_media_player
                    - if:
                        condition:
                          not:
                            voice_assistant.is_running:
                        then:
                          - voice_assistant.start:
                        else:
                          - voice_assistant.stop:

  - id: left_button
    platform: gpio
    pin:
      number: 0
      mode: INPUT_PULLUP
      # ignore_strapping_warning: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for 40ms to 400ms
          - OFF for at least 330ms
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      lambda: return id(wake_word_engine_location).current_option() == "On device";
                    then:
                      - media_player.stop:
                          id: external_media_player
                      - if:
                          condition:
                            not:
                              voice_assistant.is_running:
                          then:
                            - voice_assistant.start:
                          else:
                            - voice_assistant.stop:
      - timing:
          - ON for at least 1s
        then:
          - switch.toggle: show_battery_status
          - component.update: main_display

  - id: timer_ringing_active
    platform: template
    name: "Timer Ringing Active"
    device_class: sound
    lambda: |-
      return id(timer_ringing).state;

  - id: swipe_left
    platform: template
    name: "Swipe Left"
    device_class: moving
    entity_category: diagnostic

  - id: swipe_right
    platform: template
    name: "Swipe Right"
    device_class: moving
    entity_category: diagnostic
    
  - id: swipe_up
    platform: template
    name: "Swipe Up"
    device_class: moving
    entity_category: diagnostic
    
  - id: swipe_down
    platform: template
    name: "Swipe Down"
    device_class: moving
    entity_category: diagnostic

  - id: has_connected
    platform: template
    device_class: running
    entity_category: diagnostic
    internal: true

output:
  # colors for the clock (logical; not the screen backlight)
  - platform: template
    id: clock_color_r
    type: float
    write_action:
      - lambda: |-
          return;

  - platform: template
    id: clock_color_g
    type: float
    write_action:
      - lambda: |-
          return;

  - platform: template
    id: clock_color_b
    type: float
    write_action:
      - lambda: |-
          return;

light:
  - platform: rgb
    id: clock_color_picker
    name: "Clock Color"
    entity_category: config
    red: clock_color_r
    green: clock_color_g
    blue: clock_color_b

micro_wake_word:
  id: !extend mww
  on_wake_word_detected:
    - script.execute: reset_screensaver
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(wake_word_triggered_sound);
          - delay: 300ms
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  on_listening:
    - script.execute: reset_screensaver
    - script.execute:
        id: set_phase
        phase: ${voice_assist_waiting_for_command_phase_id}
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display

  on_stt_vad_start:
    - script.execute:
        id: set_phase
        phase: ${voice_assist_listening_phase_id}

  on_stt_vad_end:
    - script.execute:
        id: set_phase
        phase: ${voice_assist_thinking_phase_id}
    - script.execute: draw_display

  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display


  on_tts_start:
    - script.execute:
        id: send_tts_text_event
        tts_text: !lambda 'return x;'
    - script.execute: reset_screensaver
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - script.execute:
        id: set_phase
        phase: ${voice_assist_replying_phase_id}
    - lambda: 'id(playing_internal_sound) = true;'
    - script.execute: draw_display

  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'

  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s

    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: box_speaker

    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:

    - if:
        condition:
          lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          # On-device wake word: behave like your old good config
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
          - script.execute: set_idle_or_mute_phase
          - script.execute: draw_display
        else:
          # Continuous (In Home Assistant) mode:
          # don't mess with wake-word; HA handles it
          # but we still need to escape replying/thinking
          - if:
              condition:
                lambda: |-
                  return id(voice_assistant_phase) == ${voice_assist_replying_phase_id}
                      || id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};
              then:
                - script.execute: set_idle_or_mute_phase
                - script.execute: draw_display

  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - script.execute:
              id: set_phase
              phase: ${voice_assist_error_phase_id}
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - script.execute:
                    id: set_phase
                    phase: ${voice_assist_idle_phase_id}
              else:
                - script.execute:
                    id: set_phase
                    phase: ${voice_assist_muted_phase_id}
                - script.execute: draw_display

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_client_disconnected:
    - script.execute: stop_wake_word
    - script.execute:
        id: set_phase
        phase: ${voice_assist_not_ready_phase_id}
    - script.execute: draw_display

  on_timer_started:
    - script.execute: reset_screensaver
    - script.execute: draw_display

  on_timer_cancelled:
    - component.update: main_display

  on_timer_updated:
    - component.update: main_display

  on_timer_tick:
    - component.update: main_display

  on_timer_finished:
    - switch.turn_on: timer_ringing
    - wait_until:
        condition:
          - media_player.is_announcing:
    - script.execute:
        id: set_phase
        phase: ${voice_assist_timer_finished_phase_id}
    - script.execute: draw_display

interval:
  - interval: 1s
    then:
      - lambda: |-
          const bool idle_phase   = (id(voice_assistant_phase) == ${voice_assist_idle_phase_id});
          const bool not_muted    = !id(mute).state;
          const bool not_fullscreen   = !id(showing_fullscreen_image);

          id(check_if_timers_active).execute();
          const bool has_active_timer = id(global_is_timer_active);

          if (!id(init_in_progress) && idle_phase && not_muted && not_fullscreen && !has_active_timer) {
            id(idle_seconds)++;
            int delay_s = (int) id(clock_delay_seconds).state;
            if (delay_s <= 0) delay_s = 30;
            if (id(idle_seconds) >= delay_s && !id(show_clock)) {
              id(show_clock) = true;
              id(show_clock_page).execute();
            }
          } else {
            if (id(show_clock)) id(show_clock) = false;
            id(idle_seconds) = 0;
          }
      - if:
          condition:
            or:
             - display.is_displaying_page: initializing_page
             - lambda: return id(show_clock) && id(clock_show_seconds).state;
          then:
            - component.update: main_display

script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |-
                            if (id(showing_fullscreen_image)
                                && id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
                              id(main_display).show_page(empty_clock);
                              id(main_display).update();
                              return;
                            }
                            if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                                && id(show_clock)) {
                              id(show_clock_page).execute();
                              return;
                            }
                            // switch(id(voice_assistant_phase)) {
                            //   case ${voice_assist_waiting_for_command_phase_id}:
                            //   // case ${voice_assist_listening_phase_id}: 
                            //     id(main_display).show_page(listening_page);
                            //     break;
                            //   case ${voice_assist_thinking_phase_id}:
                            //     id(main_display).show_page(thinking_page);
