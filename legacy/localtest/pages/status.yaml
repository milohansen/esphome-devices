# display_pages v1.08

      - id: no_ha_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_ha), ImageAlign::CENTER);
      - id: no_wifi_page
        lambda: |-
          // it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_wifi), ImageAlign::CENTER);
          
          it.print(10, 10, id(font_icons), Color::WHITE, "\ue63e \ue648 \uf671 \uf3cc \uf356 \ue029");
      - id: status_page
        lambda: |-
          it.print(it.get_width() - 10, 10, id(font_icons), Color::WHITE, TextAlign::TOP_RIGHT, "\ue63e \ue648 \uf671 \uf3cc \uf356 \ue029");
      - id: initializing_page
        lambda: |-
          const uint32_t start_time = millis();
          const int W = it.get_width();
          const int H = it.get_height();
          it.fill(Color::BLACK);
          it.draw_pixel_at(0, 0, Color::WHITE);
          it.draw_pixel_at(0, 0, Color::BLACK);
          it.draw_pixel_at(W - 1, H - 1, Color::WHITE);
          it.draw_pixel_at(W - 1, H - 1, Color::BLACK);

          // it.printf(0, 0, id(font_big_date), Color::WHITE, TextAlign::TOP_LEFT, "W: %d, H: %d", W, H);
          
          // static int dot_count = 0;
          // dot_count = (dot_count + 1) % 4;
          auto now = id(homeassistant_time).now();
          const int dot_count = (now.second % 4);;
          std::string dots = "";
          for (int i = 0; i < dot_count; i++) dots += ".";

          const int font_height = id(font_big_clock).get_height();

          it.printf(128, 128, id(font_big_clock), Color::WHITE, TextAlign::TOP_LEFT, "Initializing%s", dots.c_str());
          it.printf(128, (128 + font_height), id(font_big_clock), Color::WHITE, TextAlign::TOP_LEFT, "Wi-Fi: %s%s", id(wifi_id).is_connected() ? "Connected" : "Connecting", id(wifi_id).is_connected() ? "" : dots.c_str());

          const uint32_t end_time = millis();
          const uint32_t render_time = (start_time - id(render_end_ms));
          it.printf(W - 1, 0, id(font_big_date), Color::WHITE, TextAlign::TOP_RIGHT, "%dms, %dms", (end_time - start_time), render_time);
          const int date_font_height = id(font_big_date).get_height();
          int offset_y = date_font_height;

          uint32_t render_times_copy[5] = {id(render_times)[0], id(render_times)[1], id(render_times)[2], id(render_times)[3], id(render_times)[4]};
          for (int i = 0; i < 5; i++) {
            it.printf(W - 1, offset_y, id(font_big_date), Color::WHITE, TextAlign::TOP_RIGHT, "%dms", render_times_copy[i]);
            offset_y += date_font_height;
            if (i < 4) {
              id(render_times)[i + 1] = render_times_copy[i];
            }
          }
          id(render_times)[0] = render_time;

          id(render_end_ms) = end_time;

      - id: updating_page
        lambda: |-
          const int W = it.get_width();
          const int H = it.get_height();
          it.fill(Color::BLACK);
          it.draw_pixel_at(0, 0, Color::WHITE);
          it.draw_pixel_at(0, 0, Color::BLACK);
          it.draw_pixel_at(W - 1, H - 1, Color::WHITE);
          it.draw_pixel_at(W - 1, H - 1, Color::BLACK);

          it.print(128, 128, id(font_big_clock), Color::WHITE, TextAlign::TOP_LEFT, "Updating...");

      - id: debug_page
        lambda: |-
          const uint32_t start_time = millis();
          const int W = it.get_width();
          const int H = it.get_height();
          it.fill(Color::BLACK);
          it.draw_pixel_at(0, 0, Color::WHITE);
          it.draw_pixel_at(0, 0, Color::BLACK);
          it.draw_pixel_at(W - 1, H - 1, Color::WHITE);
          it.draw_pixel_at(W - 1, H - 1, Color::BLACK);

          it.printf(0, 0, id(font_big_date), Color::WHITE, TextAlign::TOP_LEFT, "W: %d, H: %d", W, H);

          int offset_y = 0;
          it.print(128, 0, id(font_mega_clock), Color::WHITE, TextAlign::TOP_LEFT, "Mega Clock Font");
          offset_y += id(font_mega_clock).get_height();
          it.print(128, offset_y, id(font_big_clock), Color::WHITE, TextAlign::TOP_LEFT, "Big Clock Font");
          offset_y += id(font_big_clock).get_height();
          it.print(128, offset_y, id(font_request_response), Color::WHITE, TextAlign::TOP_LEFT, "Request Response Font");
          offset_y += id(font_request_response).get_height();
          it.print(128, offset_y, id(font_big_date), Color::WHITE, TextAlign::TOP_LEFT, "Big Date Font");
          offset_y += id(font_big_date).get_height();
          it.print(128, offset_y, id(font_big_clock_mono), Color::WHITE, TextAlign::TOP_LEFT, "Big Clock Mono Font");
          offset_y += id(font_big_clock_mono).get_height();
          it.print(128, offset_y, id(font_small_clock_mono), Color::WHITE, TextAlign::TOP_LEFT, "Small Clock Mono Font");
          offset_y += id(font_small_clock_mono).get_height();

          const uint32_t end_time = millis();
          it.printf(W - 1, 0, id(font_big_date), Color::WHITE, TextAlign::TOP_RIGHT, "%dms, %dms", (end_time - start_time), (start_time - id(render_end_ms)));
          id(render_end_ms) = end_time;

          

