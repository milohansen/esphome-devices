          it.filled_rectangle(0, 0, 124, H, Color::BLACK);

          
          it.printf(0, H, id(font_big_date), Color::WHITE, TextAlign::BOTTOM_LEFT, "Phase: %d", id(voice_assistant_phase));

          it.printf(0, 0, id(font_request_response), Color::WHITE, TextAlign::TOP_LEFT, "%s", id(text_request).state.c_str());
          it.printf(0, id(font_request_response).get_height(), id(font_request_response), Color::WHITE, TextAlign::TOP_LEFT, "%s", id(text_response).state.c_str());

          
          // auto green = Color(0, 255, 0);

