# display_pages v1.08

      # - id: default_clock
      - id: idle_clock
        lambda: |-
          const uint32_t start_time = millis();
          const int W = it.get_width();
          const int H = it.get_height();

          if (id(clock_show_wallpaper).state) {
            it.image(W / 2, H / 2, id(clock_background), ImageAlign::CENTER);
          } else {
            it.fill(Color::BLACK);
            it.draw_pixel_at(0, 0, Color::WHITE);
            it.draw_pixel_at(0, 0, Color::BLACK);
            it.draw_pixel_at(W - 1, H - 1, Color::WHITE);
            it.draw_pixel_at(W - 1, H - 1, Color::BLACK);
          }


          // Time
          auto now = id(homeassistant_time).now();

          // it.strftime(W / 2, H / 2, id(font_mega_clock), Color::WHITE, TextAlign::CENTER, "%I:%M", now);
          int hour = now.hour;
          if (!id(clock_24h).state) {
            hour %= 12;
            if (hour == 0) hour = 12;
          }

          it.printf(W / 2, H / 2, id(font_mega_clock), Color::WHITE, TextAlign::CENTER, "%d:%02d", hour, now.minute);

          // if (id(show_status).state) {
          //   // const int status_height = id(font_icons).get_height() + 20;
          //   const int status_height = 56;
          //   it.filled_rectangle(0, 0, W, status_height, Color::WHITE);
            
          //   if (id(wifi_id).is_connected()) {
          //     it.print(W - 10, 10, id(font_icons), Color::BLACK, TextAlign::TOP_RIGHT, "\ue63e");
          //   } else {
          //     it.print(W - 10, 10, id(font_icons), Color::BLACK, TextAlign::TOP_RIGHT, "\ue648");
          //   }
          // }

          it.printf(0, 0, id(font_big_date), Color::WHITE, TextAlign::TOP_LEFT, "Phase: %d", id(voice_assistant_phase));

          it.printf(W / 2, 0, id(font_request_response), Color::WHITE, TextAlign::TOP_CENTER, "%s", id(text_request).state.c_str());
          it.printf(W / 2, H, id(font_request_response), Color::WHITE, TextAlign::BOTTOM_CENTER, "%s", id(text_response).state.c_str());

          // Timing info
          const uint32_t end_time = millis();
          it.printf(W - 1, 0, id(font_big_date), Color::WHITE, TextAlign::TOP_RIGHT, "%dms, %dms", (end_time - start_time), (start_time - id(render_end_ms)));
          
          const int date_font_height = id(font_big_date).get_height();
          int offset_y = date_font_height;
          const uint32_t render_time = (start_time - id(render_end_ms));
          uint32_t render_times_copy[5] = {id(render_times)[0], id(render_times)[1], id(render_times)[2], id(render_times)[3], id(render_times)[4]};
          for (int i = 0; i < 5; i++) {
            it.printf(W - 1, offset_y, id(font_big_date), Color::WHITE, TextAlign::TOP_RIGHT, "%dms", render_times_copy[i]);
            offset_y += date_font_height;
            if (i < 4) {
              id(render_times)[i + 1] = render_times_copy[i];
            }
          }
          id(render_times)[0] = render_time;


          id(render_end_ms) = end_time;

      - id: empty_clock
        lambda: |-
          it.fill(Color::BLACK);
          const int W = it.get_width();
          const int H = it.get_height();
          // MUST be temp_fullscreen here:
          it.image(W / 2, H / 2, id(temp_fullscreen), ImageAlign::CENTER);

      # - id: presence_sensor_clock
      - id: default_clock
        lambda: |-
          const uint32_t start_time = millis();
          const int W = it.get_width();
          const int H = it.get_height();

          if (id(clock_show_wallpaper).state) {
            // it.image(W / 2, H / 2, id(clock_background), ImageAlign::CENTER);
            it.image(574, H / 2, id(landscape), ImageAlign::CENTER);
            // it.image(0, 0, id(landscape), ImageAlign::TOP_LEFT);
          } else {
            it.fill(Color::BLACK);
            it.draw_pixel_at(0, 0, Color::WHITE);
            it.draw_pixel_at(0, 0, Color::BLACK);
            it.draw_pixel_at(W - 1, H - 1, Color::WHITE);
            it.draw_pixel_at(W - 1, H - 1, Color::BLACK);
          }

          // Geometry
          const int MINWH = std::min(W, H);
          const bool SMALL = (MINWH <= 240);
          const bool MED   = (!SMALL && MINWH <= 320);
          const bool LARGE = (!SMALL && !MED && MINWH >= 400);

          const int SAFE   = SMALL ? std::max(24, MINWH / 9)
                                   : MED   ? std::max(28, MINWH / 9)
                                           : std::max(32, MINWH / 8);

          const int L = SAFE, R = W - SAFE, T = SAFE, B = H - SAFE;


          // Time
          auto now = id(homeassistant_time).now();

          int hour = now.hour;
          if (!id(clock_24h).state) {
            hour %= 12;
            if (hour == 0) hour = 12;
          }

          const int margin = 60;
          const int clock_left = 124;
          it.printf(clock_left + margin, H - margin, id(font_big_clock), Color::WHITE, TextAlign::BOTTOM_LEFT, "%d:%02d", hour, now.minute);

          // Date
          it.strftime(clock_left + margin, H - margin - id(font_big_clock).get_height(), id(font_big_date), Color::WHITE, TextAlign::BOTTOM_LEFT, "%a, %b %d", now);

          if (id(show_status).state) {
